<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文脈 · DSE 中文十六篇指定精讀</title>
<style>
:root{
  --paper:#F8F4EC; --paper2:#FFFDF8; --ink:#1A1A1A; --ink2:#5A5040;
  --cinnabar:#C0392B; --jade:#7BA9A2; --gold:#C9A96E; --line:#E6DCCB;
  --shadow:0 2px 10px rgba(90,70,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:var(--paper);
  background-image:radial-gradient(circle at 20% 10%, rgba(201,169,110,.06) 0%, transparent 45%),
                   radial-gradient(circle at 85% 80%, rgba(123,169,162,.05) 0%, transparent 40%);
  color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
}
.kai{font-family:"Kaiti","KaiTi","STKaiti","DFKai-SB","Songti TC",serif;}

/* HEADER */
header{position:sticky;top:0;z-index:120;background:rgba(248,244,236,.94);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
.hd-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 20px;}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.logo-seal{width:36px;height:36px;border-radius:8px;background:var(--cinnabar);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:"Kaiti",serif;
  font-size:20px;font-weight:700;box-shadow:0 2px 6px rgba(192,57,43,.3);}
.logo-txt h1{font-size:17px;font-weight:700;letter-spacing:2px;line-height:1.2;}
.logo-txt p{font-size:10.5px;color:var(--ink2);letter-spacing:.5px;line-height:1.2;}
nav.tabs{margin-left:auto;display:flex;gap:3px;background:#EFE8DA;padding:4px;border-radius:10px;flex-wrap:wrap;}
nav.tabs button{border:none;background:transparent;cursor:pointer;font-family:inherit;
  font-size:13px;color:var(--ink2);padding:7px 13px;border-radius:7px;transition:.2s;font-weight:500;}
nav.tabs button.on{background:#fff;color:var(--cinnabar);box-shadow:var(--shadow);font-weight:700;}

.view{display:none;} .view.on{display:block;}

/* READER */
.reader{display:flex;max-width:1320px;margin:0 auto;align-items:flex-start;}
.sidebar{width:250px;flex-shrink:0;padding:18px 12px 60px;position:sticky;top:65px;
  max-height:calc(100vh - 65px);overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:5px;}
.sidebar::-webkit-scrollbar-thumb{background:#DDD2BE;border-radius:4px;}
.sb-title{font-size:11px;letter-spacing:2px;color:var(--ink2);padding:0 8px 10px;font-weight:600;}
.chap-item{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:8px;
  cursor:pointer;transition:.16s;margin-bottom:2px;}
.chap-item:hover{background:#F1EADC;}
.chap-item.on{background:#fff;box-shadow:var(--shadow);}
.chap-item.on .ci-num{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);}
.ci-num{flex-shrink:0;width:21px;height:21px;border-radius:5px;border:1px solid var(--line);
  background:#FBF7EF;font-size:11px;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-weight:700;margin-top:2px;}
.ci-title{font-size:13.5px;font-weight:600;line-height:1.4;}
.ci-sub{font-size:11px;color:#998E7B;margin-top:1px;}

.content{flex:1;min-width:0;padding:22px 26px 120px;max-width:960px;}
.ch-head{background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:22px 26px;margin-bottom:20px;position:relative;overflow:hidden;}
.ch-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--cinnabar),var(--gold));}
.ch-head h2{font-size:24px;letter-spacing:2px;margin-bottom:6px;}
.ch-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.ch-meta span{font-size:11.5px;padding:2px 10px;border-radius:20px;background:#F2EADC;
  color:#7A6A4E;border:1px solid #E6D9BF;}
.ch-intro{font-size:13.5px;color:var(--ink2);line-height:1.85;}
.sec-name{font-family:"Kaiti",serif;font-size:16px;color:var(--cinnabar);letter-spacing:2px;
  margin:26px 0 12px;padding-left:12px;border-left:3px solid var(--cinnabar);}

/* SENTENCE */
.sentence{background:var(--paper2);border:1px solid var(--line);border-radius:11px;
  padding:14px 18px 13px;margin-bottom:11px;cursor:pointer;transition:.18s;position:relative;}
.sentence:hover{border-color:#DBC99E;box-shadow:0 2px 12px rgba(160,130,70,.08);}
.sentence.open{border-color:var(--gold);box-shadow:0 3px 16px rgba(160,130,70,.11);}
.s-text{font-family:"Kaiti",serif;font-size:18.5px;line-height:2.05;color:#241F19;letter-spacing:.5px;}
.s-trans{font-size:13.5px;color:#3E6B63;line-height:1.8;margin-top:9px;padding:8px 12px;
  background:#F0F6F4;border-radius:7px;border-left:3px solid var(--jade);display:none;}
.sentence.open .s-trans{display:block;}
.s-tags{display:flex;flex-wrap:wrap;gap:0;margin-top:7px;}
.tag{display:inline-block;font-size:11px;padding:1.5px 9px;border-radius:20px;margin:3px 6px 0 0;line-height:1.6;}
.tag-rhet{background:#FDECEA;color:#B23A2C;border:1px solid #F2C8C2;}
.tag-tech{background:#EAF4F2;color:#2E6B62;border:1px solid #C5E0DC;}
.tag-point{background:#FBF4E6;color:#8A6A2F;border:1px solid #EAD9B5;}
.tag-emo{background:#F3EAF7;color:#6B4A8A;border:1px solid #DCC8E8;}
.tag-sym{background:#EAF0FB;color:#3A5A9E;border:1px solid #C8D6F0;}
.tag-deep{background:#FDF2E9;color:#A05A20;border:1px solid #F0D6BA;}
.tag-fw{background:#EAF7EE;color:#2E7A45;border:1px solid #C0E0CC;}

.s-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
.sentence.open .s-detail{display:block;}

/* 分析區塊 */
.an-block{border-radius:9px;padding:12px 15px;margin-bottom:11px;font-size:13px;line-height:1.85;}
.an-block .an-title{font-size:11.5px;font-weight:700;letter-spacing:1.5px;margin-bottom:7px;
  display:flex;align-items:center;gap:6px;}
.an-block .an-title::before{content:"";width:4px;height:13px;border-radius:2px;display:inline-block;}
.an-emo{background:#FAF6FC;border:1px solid #EEE2F5;}
.an-emo .an-title{color:#6B4A8A;} .an-emo .an-title::before{background:#7B4F9E;}
.an-sym{background:#F4F7FD;border:1px solid #E0E8F7;}
.an-sym .an-title{color:#3A5A9E;} .an-sym .an-title::before{background:#3A5A9E;}
.an-deep{background:#FDF8F2;border:1px solid #F3E4D2;}
.an-deep .an-title{color:#A05A20;} .an-deep .an-title::before{background:#D4782F;}
.an-rhet{background:#FEF6F5;border:1px solid #F8E0DC;}
.an-rhet .an-title{color:#B23A2C;} .an-rhet .an-title::before{background:#C0392B;}
.an-tech{background:#F3F9F8;border:1px solid #DCEDEA;}
.an-tech .an-title{color:#2E6B62;} .an-tech .an-title::before{background:#4E9E78;}
.an-point{background:#FEFAF0;border:1px solid #F5E9CF;}
.an-point .an-title{color:#8A6A2F;} .an-point .an-title::before{background:#C9A96E;}
.an-fw{background:#F2FAF5;border:1px solid #D5EDDF;}
.an-fw .an-title{color:#2E7A45;} .an-fw .an-title::before{background:#2E7A45;}

/* 字詞精練 */
.word-grid{display:flex;flex-direction:column;gap:8px;}
.word-item{background:#fff;border:1px solid #F0E6D2;border-radius:8px;padding:9px 13px;}
.word-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.word-head b{font-size:16px;color:var(--cinnabar);font-family:"Kaiti",serif;}
.word-head .py{font-size:11px;color:#A2967F;}
.word-head .pos{font-size:10.5px;padding:1px 7px;border-radius:4px;background:#F2EADC;color:#8A7A5C;}
.word-def{font-size:12.5px;color:var(--ink2);margin-top:4px;}
.word-deep{font-size:12px;color:#6B5E48;margin-top:5px;padding-top:5px;border-top:1px dotted #EEE2CC;line-height:1.75;}
.word-deep b{color:#A05A20;font-weight:600;}

.w{border-bottom:1.5px dashed var(--gold);color:#8A5A2B;cursor:help;transition:.15s;padding-bottom:1px;}
.w:hover{background:#FFF2D6;border-radius:3px;}

#wpop{position:fixed;z-index:300;max-width:270px;background:#26221C;color:#F5EFE3;
  font-size:12.5px;line-height:1.65;padding:10px 14px;border-radius:9px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);display:none;pointer-events:none;}
#wpop b{color:#F0C36A;display:block;font-size:14px;margin-bottom:3px;font-family:"Kaiti",serif;}
#wpop .wp-deep{color:#C9C0B0;font-size:11.5px;margin-top:5px;padding-top:5px;border-top:1px solid #3A352E;}

/* 作答框架模組 */
.fw-wrap{max-width:920px;margin:0 auto;padding:24px 20px 120px;}
.fw-intro{background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow);}
.fw-intro h2{font-size:19px;letter-spacing:1px;margin-bottom:8px;color:var(--cinnabar);font-family:"Kaiti",serif;}
.fw-intro p{font-size:13.5px;color:var(--ink2);line-height:1.9;}
.fw-card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);}
.fw-card h3{font-size:16px;color:#2E7A45;margin-bottom:14px;display:flex;align-items:center;gap:9px;
  font-family:"Kaiti",serif;letter-spacing:1px;}
.fw-card h3 .fw-no{width:26px;height:26px;border-radius:7px;background:#2E7A45;color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-weight:700;}
.fw-steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.fw-step{background:#F2FAF5;border:1px solid #C8E6D5;border-radius:8px;padding:7px 13px;font-size:12.5px;
  color:#2E7A45;font-weight:600;position:relative;}
.fw-step::after{content:"→";position:absolute;right:-16px;color:#A8C9B5;font-weight:400;}
.fw-step:last-child::after{display:none;}
.fw-formula{background:#FCFAF5;border:1px dashed #D8C9A8;border-radius:9px;
  padding:13px 16px;font-size:13px;color:#5A4A2A;line-height:1.9;margin-bottom:13px;}
.fw-formula b{color:var(--cinnabar);}
.fw-example{background:#F8FBF9;border-left:3px solid var(--jade);border-radius:0 9px 9px 0;
  padding:13px 17px;font-size:13px;color:#3A4A44;line-height:1.9;}
.fw-example .ex-label{font-size:11px;color:#4E9E78;font-weight:700;letter-spacing:1px;margin-bottom:5px;}
.fw-example .ex-text{font-family:"Kaiti",serif;font-size:14px;color:#2E5C4A;}

/* PRACTICE */
.practice-wrap{max-width:820px;margin:0 auto;padding:24px 20px 120px;}
.p-filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
.chip{font-size:12.5px;padding:5px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper2);cursor:pointer;transition:.16s;font-family:inherit;color:var(--ink2);}
.chip:hover{border-color:var(--gold);}
.chip.on{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);font-weight:600;}
.p-card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:24px 26px;box-shadow:var(--shadow);}
.p-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.p-prog{margin-left:auto;font-size:12px;color:#A2967F;font-weight:600;}
.p-q{font-size:16px;line-height:1.85;margin-bottom:18px;font-weight:500;}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#FCFAF5;
  border:1px solid var(--line);border-radius:9px;padding:11px 15px;margin-bottom:9px;cursor:pointer;
  font-family:inherit;font-size:14px;color:#332D25;line-height:1.7;transition:.16s;}
.opt:hover:not(.done){border-color:var(--gold);background:#FFFBF0;}
.opt-key{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:#EFE7D7;color:#8A7A5C;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.opt.right{background:#EAF6F0;border-color:#7FBFA0;} .opt.right .opt-key{background:#4E9E78;color:#fff;}
.opt.wrong{background:#FDEDEB;border-color:#E5A79E;} .opt.wrong .opt-key{background:#C0392B;color:#fff;}
.opt.done{cursor:default;}
.p-exp{display:none;margin-top:16px;padding:14px 17px;background:#FBF6EA;
  border-left:3px solid var(--gold);border-radius:0 9px 9px 0;font-size:13.5px;line-height:1.85;color:#4A4133;}
.p-exp.on{display:block;} .p-exp b{color:var(--cinnabar);}
.p-foot{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap;}
.btn{font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 24px;border-radius:9px;border:none;cursor:pointer;transition:.16s;}
.btn-primary{background:var(--cinnabar);color:#fff;box-shadow:0 2px 8px rgba(192,57,43,.25);}
.btn-primary:hover{background:#A93226;}
.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--gold);}
.p-score{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:600;}
.p-score b{color:var(--cinnabar);font-size:16px;}

/* NOTES / STATS */
.notes-wrap,.stats-wrap{max-width:920px;margin:0 auto;padding:24px 20px 120px;}
.note-card{background:var(--paper2);border:1px solid var(--line);border-radius:12px;
  padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow);}
.note-card h4{font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px;}
.note-card textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--line);
  border-radius:8px;padding:10px 13px;font-family:inherit;font-size:13.5px;line-height:1.8;
  background:#FCFAF5;color:var(--ink);outline:none;}
.note-card textarea:focus{border-color:var(--gold);background:#fff;}
.save-hint{font-size:11px;color:#4E9E78;opacity:0;transition:.3s;margin-top:5px;}
.save-hint.on{opacity:1;}
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:12px;
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.panel h3{font-size:14.5px;margin-bottom:16px;letter-spacing:1px;color:#3A3227;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
.stat-box{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
.stat-box .num{font-size:28px;font-weight:700;color:var(--cinnabar);line-height:1.2;font-family:"Kaiti",serif;}
.stat-box .num small{font-size:14px;color:#B5AA96;font-weight:400;}
.stat-box .lbl{font-size:12px;color:var(--ink2);margin-top:3px;}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:13px;}
.bar-lbl{width:88px;flex-shrink:0;color:var(--ink2);}
.bar-track{flex:1;height:9px;background:#EFE8DA;border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--jade),#4E9E78);transition:width .5s;}
.bar-fill.low{background:linear-gradient(90deg,#E5A79E,var(--cinnabar));}
.bar-val{width:60px;text-align:right;color:#8A7A5C;font-size:12px;flex-shrink:0;}
.empty{text-align:center;color:#B5AA96;font-size:13.5px;padding:40px 0;}

@media (max-width:900px){
  .hd-inner{padding:10px 12px;gap:8px;flex-wrap:wrap;}
  .logo-txt p{display:none;}
  nav.tabs button{padding:6px 10px;font-size:12px;}
  .reader{flex-direction:column;}
  .sidebar{width:100%;position:static;max-height:none;display:flex;gap:7px;overflow-x:auto;
    border-bottom:1px solid var(--line);padding:11px 12px;}
  .sidebar::-webkit-scrollbar{height:0;}
  .sb-title{display:none;}
  .chap-item{flex-shrink:0;background:var(--paper2);border:1px solid var(--line);padding:6px 12px;margin:0;}
  .chap-item .ci-num{display:none;} .ci-sub{display:none;}
  .ci-title{font-size:12.5px;white-space:nowrap;}
  .content{padding:16px 14px 100px;}
  .ch-head{padding:18px;} .ch-head h2{font-size:20px;}
  .s-text{font-size:17px;} .p-card{padding:18px 16px;} .p-q{font-size:15px;}
  .opt{font-size:13.5px;padding:10px 12px;} .logo-txt h1{font-size:15px;}
}
</style>
</head>
<body>

<header>
  <div class="hd-inner">
    <div class="logo" onclick="switchView('read')">
      <div class="logo-seal">文</div>
      <div class="logo-txt"><h1>文脈</h1><p>DSE 中文十六篇 · 逐句精讀</p></div>
    </div>
    <nav class="tabs">
      <button data-v="read" class="on" onclick="switchView('read')">精讀</button>
      <button data-v="framework" onclick="switchView('framework')">作答框架</button>
      <button data-v="practice" onclick="switchView('practice')">練習</button>
      <button data-v="notes" onclick="switchView('notes')">筆記</button>
      <button data-v="stats" onclick="switchView('stats')">統計</button>
    </nav>
  </div>
</header>

<section id="view-read" class="view on">
  <div class="reader">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="readerContent"></main>
  </div>
</section>

<section id="view-framework" class="view">
  <div class="fw-wrap" id="fwBody"></div>
</section>

<section id="view-practice" class="view">
  <div class="practice-wrap">
    <div class="p-filters" id="pFilters"></div>
    <div id="pBody"></div>
  </div>
</section>

<section id="view-notes" class="view">
  <div class="notes-wrap">
    <div class="panel" style="margin-bottom:18px;">
      <h3>📝 我的筆記本</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;">
        為每篇範文記下你的理解、答題框架與易錯點。內容自動儲存於本機瀏覽器，離線亦可溫習。
      </p>
    </div>
    <div id="notesBody"></div>
  </div>
</section>

<section id="view-stats" class="view">
  <div class="stats-wrap" id="statsBody"></div>
</section>

<div id="wpop"></div>

<script>
/* =========================================================
   作答框架資料
   ========================================================= */
const FRAMEWORKS = [
{
  title:'修辭手法題', no:1,
  steps:['手法名稱','引文具體內容','效果分析'],
  formula:'【修辭手法】＋【引文內容（如何運用）】＋【效果分析（對表達的作用）】',
  example:'作者以<b>比喻</b>手法，將「以地事秦」比作「抱薪救火」，生動形象地說明了賄賂秦國只會加速自身滅亡的道理，使抽象的政治論述變得具體可感，增強了說服力。',
  note:'答題時切忌只寫手法名稱，必須引原文並分析效果；效果分析要扣緊「形象生動」「增強說服力」「突出情感」等方向。'
},
{
  title:'寫作手法分析題', no:2,
  steps:['手法判斷','文本證據','效果闡述','扣題回應'],
  formula:'【手法判斷】→【文本證據（引文）】→【效果闡述（對人物／主旨／結構的作用）】→【扣題回應】',
  example:'司馬遷運用<b>詳略得宜</b>的敘事手法。「完璧歸趙」一事詳加鋪陳，突出藺相如的機智勇敢；而「澠池之會」則以簡筆帶過。此舉使人物形象更鮮明，敘事節奏富變化，避免流水帳式記載，亦緊扣「智勇忠義」的主題。',
  note:'不同手法有不同分析方向：敘事手法重結構與人物塑造，描寫手法重畫面與氛圍，抒情手法重情感傳達。'
},
{

{q:'「志士仁人，無求生以害仁」中「害」的意思是？',o:['傷害身體','妨害、損害','畏懼','嫉妒'],a:1,t:'字詞',c:'論仁、論孝、論君子',e:'「害」解作妨害、損害。「害仁」即損害仁德。全句謂志士仁人不會為求活命而損害仁德，體現仁高於生命的價值取向。'},
{q:'「君子坦蕩蕩，小人長戚戚」運用了甚麼修辭手法？',o:['比喻','對偶','排比','誇張'],a:1,t:'修辭',c:'論仁、論孝、論君子',e:'此句為對偶：君子／小人、坦蕩蕩／長戚戚，句式工整對舉，以疊字形成音韻與心理的強烈對比。'},
{q:'孔子認為「孝」與單純「養」父母的分別在於？',o:['供養的豐厚程度','是否與父母同住','有沒有「敬」的態度','能否繼承父志'],a:2,t:'內容理解',c:'論仁、論孝、論君子',e:'孔子指出「至於犬馬，皆能有養；不敬，何以別乎」，強調「敬」是孝與飼養禽畜的根本分別，孝＝養＋敬。'},
{q:'「事父母幾諫」中「幾」的意思是？',o:['幾次','輕微、委婉','幾乎','機會'],a:1,t:'字詞',c:'論仁、論孝、論君子',e:'「幾」解作輕微、委婉。「幾諫」即委婉地勸諫父母，避免直接頂撞，體現儒家溫柔敦厚的處世哲學。'},
{q:'「君子喻於義，小人喻於利」中「喻」的意思是？',o:['比喻','明白、通曉','教導','比較'],a:1,t:'字詞',c:'論仁、論孝、論君子',e:'「喻」解作明白、通曉。君子所明白的是義，小人所明白的是利，此即儒家「義利之辨」，是判斷人格高下的核心標準。'},
{q:'「殺身成仁」與《魚我所欲也》的「捨生取義」共同體現了？',o:['道家超脫','儒家以道德為最高價值的取向','法家功利','佛家出世'],a:1,t:'跨篇比較',c:'跨篇章',e:'兩者同屬儒家價值系統：皆認為道德（仁／義）的價值高於個體生命，在不可兼得時應捨生取義／殺身成仁。'},

/* 魚我所欲也 */
{q:'「二者不可得兼，舍生而取義者也」體現的中心思想是？',o:['貪生怕死','捨生取義','明哲保身','知足常樂'],a:1,t:'內容理解',c:'魚我所欲也',e:'此為全文中心論點：當生命與道義不能兼得時，應捨棄生命而取道義。「舍生取義」成為中華文化中「義高於生」的經典表述。'},
{q:'「呼爾而與之」中「爾」的意思是？',o:['你','語氣詞，表輕蔑地呼喝','如此','而已'],a:1,t:'字詞',c:'魚我所欲也',e:'「爾」為語氣詞，配合「呼」表示吆喝、輕蔑的語氣。「呼爾而與之」即吆喝著給人食物，寫出施捨者的無禮。'},
{q:'「蹴爾而與之，乞人不屑也」中「蹴」的意思是？',o:['用腳踢','催促','蹲下','突然'],a:0,t:'字詞',c:'魚我所欲也',e:'「蹴」解作用腳踢。此句寫以腳踢食物給乞丐，乞丐亦不屑接受，即「嗟來之食」之意，象徵人對尊嚴的堅守。'},
{q:'本文以「魚」與「熊掌」設喻，在論證上屬於？',o:['對比論證','比喻論證','舉例論證','引用論證'],a:1,t:'寫作手法',c:'魚我所欲也',e:'孟子以「魚」喻生、「熊掌」喻義，先設喻再類推到「生」與「義」的取捨，屬比喻論證，使抽象道理具體化。'},
{q:'「非獨賢者有是心也，人皆有之，賢者能勿喪耳」說明甚麼？',o:['只有賢人有本心','人人皆有本心，賢人能保存不失','賢人天生異稟','本心會自然消失'],a:1,t:'內容理解',c:'魚我所欲也',e:'此句體現孟子性善論：本心人人皆有，差別只在賢者能保存而不喪失。這既肯定了人性的普遍尊嚴，也指出了道德修養的方向。'},
{q:'「萬鍾則不辯禮義而受之」中「萬鍾」借代甚麼？',o:['大量糧食','優厚的俸祿','鐘聲','官位'],a:1,t:'修辭',c:'魚我所欲也',e:'「鍾」是古代量器，「萬鍾」借代優厚的俸祿。此句批判見利忘義之人，與前文乞人「不屑」形成強烈反差。'},

/* 逍遙遊 */
{q:'「怒而飛」的「怒」意思是？',o:['憤怒','奮力、振作','責備','急速'],a:1,t:'字詞',c:'逍遙遊',e:'「怒」在此解作奮力、振作，形容大鵬振翅奮飛之勢，並非憤怒。此為常考字詞。'},
{q:'「其翼若垂天之雲」用了甚麼修辭手法？',o:['比喻','對偶','排比','借代'],a:0,t:'修辭',c:'逍遙遊',e:'以「若」字作明喻標誌，將鵬翼比作掛在天邊的雲，極言其巨大，是比喻手法的典型運用。'},
{q:'「水之積也不厚，則其負大舟也無力」在全文中的作用是？',o:['單純描寫大海','以水喻風，說明大鵬需厚風方能高飛','批評世人目光短淺','讚美鯤鵬之大'],a:1,t:'寫作手法',c:'逍遙遊',e:'此句以水負大舟為喻，類推到風負大翼，說明大鵬高飛須憑藉深厚之風，即萬物「有所待」，是全文論證的核心。'},
{q:'「覆杯水於坳堂之上，則芥為之舟」中「芥」指？',o:['芥菜','小草','芥末','塵埃'],a:1,t:'字詞',c:'逍遙遊',e:'「芥」指小草。倒一杯水在低窪處，放一根小草便可作船，放杯子則黏住不動，說明水淺不能載大物，即「積厚」之理。'},
{q:'莊子借大鵬的形象主要想說明甚麼？',o:['鳥類的偉大','萬物皆有所待，需積厚方能致遠','人類的渺小','自然之美'],a:1,t:'內容理解',c:'逍遙遊',e:'大鵬雖大，仍須待厚風方能高飛，說明萬物皆「有所待」，唯有破除依待才能達致逍遙。這是莊子哲學的核心命題。'},
{q:'「海運則將徙於南冥」中「海運」的意思是？',o:['海上運輸','海水翻騰震動','航海','潮汐'],a:1,t:'字詞',c:'逍遙遊',e:'「海運」古義指海水翻騰震動，非今日「海上運輸」之意，屬古今異義，是常考字詞。'},

/* 勸學 */
{q:'「學不可以已」中「已」的意思是？',o:['已經','停止','完成','足夠'],a:1,t:'字詞',c:'勸學',e:'「已」解作停止。全句謂學習是不可以停止的，為全文中心論點，強調學習是持續不斷的過程。'},
{q:'「青，取之於藍，而青於藍」用了甚麼論證手法？',o:['比喻論證','舉例論證','對比論證','引用論證'],a:0,t:'寫作手法',c:'勸學',e:'以靛青從藍草提取卻比藍草更青，比喻學習能使人超越本源，屬比喻論證，鼓勵學習者青出於藍。'},
{q:'「木直中繩，輮以為輪」中「中」的意思是？',o:['中間','符合','集中','中等'],a:1,t:'字詞',c:'勸學',e:'「中」解作符合。「中繩」即合乎墨線，形容木材筆直。此句以木材經火烤彎曲為喻，說明學習能改變人的本性。'},
{q:'「君子生非異也」中「生」通假為哪個字？',o:['性','勝','聲','甥'],a:0,t:'字詞',c:'勸學',e:'「生」通「性」，指天性、資質。全句謂君子的天性與常人並無不同，只是善於借助外物，破除天才論。'},
{q:'「鍥而不捨，金石可鏤」說明甚麼道理？',o:['金石可以雕刻','堅持不懈的重要','工具的重要','學習的痛苦'],a:1,t:'內容理解',c:'勸學',e:'此句以雕刻為喻，說明只要堅持不懈，即使堅硬的金石也能雕鏤，強調持之以恆，是全篇最具感染力的名句之一。'},
{q:'荀子認為學習最終可以達到的效果是？',o:['改變本性、知明而行無過','升官發財','超脫生死','遠離世俗'],a:0,t:'內容理解',c:'勸學',e:'荀子謂「君子博學而日參省乎己，則知明而行無過矣」，認為學習能改變本性、提升智慧、端正行為，體現「學以成人」的思想。'},

/* 廉頗藺相如列傳 */
{q:'「臣請完璧歸趙」中「完」的用法是？',o:['完成','使動用法，使……完好無損','結束','修補'],a:1,t:'字詞',c:'廉頗藺相如列傳',e:'「完」在此為使動用法，「完璧」即「使璧完好無損」地帶回趙國。此為常考語法點，亦見藺相如的使命必達。'},
{q:'「怒髮上衝冠」用了甚麼修辭手法？',o:['誇張','比喻','擬人','排比'],a:0,t:'修辭',c:'廉頗藺相如列傳',e:'以頭髮豎起頂起帽子的誇張描寫，將藺相如內心的極度憤怒外化為具體形象，極具感染力，是常考誇張句。'},
{q:'「臣所以去親戚而事君者」中「親戚」的古義是？',o:['泛指親屬','父母兄弟等至親','朋友','鄰居'],a:1,t:'字詞',c:'廉頗藺相如列傳',e:'「親戚」古義指父母兄弟等至親，與今日泛指親屬不同，屬古今異義。此句寫藺相如重義輕利、見識不凡。'},
{q:'藺相如處處避讓廉頗的原因是？',o:['畏懼廉頗的權勢','以先國家之急而後私讎','身體不適','不想爭權奪利'],a:1,t:'內容理解',c:'廉頗藺相如列傳',e:'藺相如明言「吾所以為此者，以先國家之急而後私讎也」，把國家安危放在私人恩怨之前，展現其以國為先的胸襟。'},
{q:'「肉袒負荊」中「負」的意思是？',o:['背負','辜負','失敗','依靠'],a:0,t:'字詞',c:'廉頗藺相如列傳',e:'「負」解作背負。「肉袒負荊」指脫去上衣、背著荊條，表示認罪願受鞭打，是極其謙卑的請罪方式。'},
{q:'本文「完璧歸趙」詳寫、「澠池之會」略寫，屬於甚麼手法？',o:['詳略得宜','倒敘','插敘','對比'],a:0,t:'寫作手法',c:'廉頗藺相如列傳',e:'司馬遷詳寫完璧歸趙以突出藺相如的智勇，澠池之會則以簡筆帶過，使敘事節奏富變化，避免流水帳，是詳略得宜的典範。'},

/* 出師表 */
{q:'「此誠危急存亡之秋也」中「秋」的意思是？',o:['秋天','時期、時刻','收成','憂愁'],a:1,t:'字詞',c:'出師表',e:'「秋」在此解作時期、時刻，指關鍵緊要的關頭。「危急存亡之秋」即危急存亡的時刻，是必考字詞。'},
{q:'「不宜妄自菲薄，引喻失義」中「菲薄」的意思是？',o:['輕薄','看輕自己','節儉','卑微'],a:1,t:'字詞',c:'出師表',e:'「菲薄」即看輕、輕視，「妄自菲薄」指過分看輕自己，是諸葛亮勸諫後主之語，為必考成語。'},
{q:'「親賢臣，遠小人，此先漢所以興隆也」用了甚麼手法？',o:['對比','比喻','排比','誇張'],a:0,t:'寫作手法',c:'出師表',e:'此句以「親賢臣，遠小人」與「親小人，遠賢臣」正反對比，並舉兩漢興亡為證，屬對比論證兼舉例論證。'},
{q:'「臣本布衣」中「布衣」的修辭手法是？',o:['比喻','借代','誇張','用典'],a:1,t:'修辭',c:'出師表',e:'「布衣」以平民所穿的衣服借代平民，是借代手法，同時流露諸葛亮自謙之意，為常考修辭。'},
{q:'「三顧臣於草廬之中」中「三顧」指？',o:['三次責備','三次拜訪','三次回顧','三次商議'],a:1,t:'字詞',c:'出師表',e:'「顧」解作拜訪，「三顧」即三次到草廬拜訪，指劉備三顧茅廬的知遇之恩，是諸葛亮感念先帝的原因。'},
{q:'諸葛亮在表中反覆提及「先帝」，主要作用是？',o:['單純懷念故人','借先帝之名勸勉後主、表明忠誠','炫耀自己的功績','責備後主無能'],a:1,t:'寫作手法',c:'出師表',e:'反覆提及先帝，既借先帝的知遇之恩表明自己的忠誠，又以先帝遺德勸勉後主，情理兼備，增強說服力。'},

/* 師說 */
{q:'「師者，所以傳道、受業、解惑也」中「受」通假為？',o:['授','收','承受','接受'],a:0,t:'字詞',c:'師說',e:'「受」通「授」，解作傳授。「傳道、受業、解惑」即老師的三大職責，其中「傳道」為核心，體現儒家以道為先的教育理念。'},
{q:'「道之所存，師之所存也」說明擇師的標準是？',o:['年齡長幼','地位高低','道的有無','官職大小'],a:2,t:'內容理解',c:'師說',e:'韓愈認為「無貴無賤，無長無少，道之所存，師之所存也」，擇師的唯一標準是「道」，破除世俗以地位、年齡取師的偏見。'},
{q:'「位卑則足羞，官盛則近諛」用了甚麼修辭手法？',o:['對偶','比喻','誇張','反問'],a:0,t:'修辭',c:'師說',e:'「位卑」對「官盛」，「足羞」對「近諛」，句式工整對舉，揭露世人以地位取師的功利心態，批判有力。'},
{q:'「是故弟子不必不如師」中「不必」的意思是？',o:['不需要','不一定','必然不','必須不'],a:1,t:'字詞',c:'師說',e:'「不必」古義為「不一定」，與今日「不需要」不同。全句謂弟子不一定不如老師，體現師生關係的相對性。'},
{q:'韓愈寫作《師說》的主要目的是？',o:['讚美老師的偉大','批評當時恥學於師的風氣','介紹教學方法','記述自己的老師'],a:1,t:'內容理解',c:'師說',e:'韓愈針對唐代士大夫「恥學於師」的風氣而作，倡導尊師重道，並提出新的師生觀，是古文運動的重要作品。'},
{q:'「聞道有先後，術業有專攻」說明甚麼？',o:['老師一定比學生強','師生關係是相對的，各有所長','術業無高低之分','道比術更重要'],a:1,t:'內容理解',c:'師說',e:'此句說明聞道有先後之別，學問技藝各有專長，故弟子不必不如師，師不必賢於弟子，師生關係是相對的，是對傳統師道觀的重大突破。'},

/* 始得西山宴遊記 */
{q:'「自余為僇人」中「僇人」指？',o:['殺人犯','受刑辱的罪人','僕人','旅客'],a:1,t:'字詞',c:'始得西山宴遊記',e:'「僇」通「戮」，「僇人」指受刑辱的罪人，是柳宗元被貶後的自稱，點明其貶謫身份。'},
{q:'「恆惴慄」中「惴慄」的意思是？',o:['恐懼不安','憤怒不平','疲累不堪','興奮難抑'],a:0,t:'字詞',c:'始得西山宴遊記',e:'「惴慄」解作恐懼不安，寫出柳宗元貶謫永州後終日惶恐的心境，奠定全文憂懼的基調。'},
{q:'「然後知吾嚮之未始遊」中「嚮」的意思是？',o:['方向','從前','趨向','響應'],a:1,t:'字詞',c:'始得西山宴遊記',e:'「嚮」通「向」，解作從前。全句謂從前根本未曾真正遊覽過，真正的遊覽從遊西山才開始，點明心境轉折。'},
{q:'「凡數州之土壤，皆在衽席之下」用了甚麼手法表現西山之高？',o:['比喻','誇張','擬人','排比'],a:1,t:'修辭',c:'始得西山宴遊記',e:'此句以誇張手法極寫登西山後視野之高遠，數州土地盡在坐席之下，反襯西山之特出與心胸之開闊。'},
{q:'柳宗元遊西山後的心境是？',o:['更加憂鬱苦悶','超脫物我、精神解脫','強烈思念家鄉','憤世嫉俗'],a:1,t:'內容理解',c:'始得西山宴遊記',e:'柳宗元登西山後「心凝形釋，與萬化冥合」，達到物我兩忘的境界，從貶謫的憂懼中獲得精神解脫，是全文主旨所在。'},
{q:'「箕踞而遨」中「箕踞」的意思是？',o:['像簸箕一樣張開兩腿而坐','蹲下身子','快步行走','攀爬而上'],a:0,t:'字詞',c:'始得西山宴遊記',e:'「箕踞」指像簸箕一樣張開兩腿而坐，是不拘禮節的坐姿，寫出柳宗元登高後的自在灑脫。'},

/* 岳陽樓記 */
{q:'「滕子京謫守巴陵郡」中「謫」的意思是？',o:['責備','貶官','調升','辭官'],a:1,t:'字詞',c:'岳陽樓記',e:'「謫」解作貶官。「謫守巴陵郡」即被貶到巴陵郡做太守，點明滕子京的貶謫身份，為後文抒情議論奠下背景。'},
{q:'「銜遠山，吞長江」用了甚麼修辭手法？',o:['擬人兼誇張','對偶','排比','借代'],a:0,t:'修辭',c:'岳陽樓記',e:'「銜」「吞」二字將洞庭湖人格化，寫出湖水連接遠山、吞噬長江的雄偉氣勢，屬擬人兼誇張，氣勢磅礴。'},
{q:'「不以物喜，不以己悲」用了甚麼修辭手法？',o:['互文','比喻','誇張','設問'],a:0,t:'修辭',c:'岳陽樓記',e:'此句為互文，上下句互相補充，意為「不因外物的好壞和自己的得失而或喜或悲」，須合併理解，是高頻考點。'},
{q:'「先天下之憂而憂，後天下之樂而樂」表現了范仲淹？',o:['追求個人享樂','憂國憂民、以天下為己任','消極避世','隨遇而安'],a:1,t:'內容理解',c:'岳陽樓記',e:'此句為全文主旨，抒發了范仲淹以天下為己任、先憂後樂的宏大襟懷，成為中國士人精神的經典表述。'},
{q:'「至若春和景明」中「景」的意思是？',o:['景色','日光','影子','情況'],a:1,t:'字詞',c:'岳陽樓記',e:'「景」在此解作日光。「春和景明」即春風和煦、陽光明媚，是描寫春日湖景的名句。'},
{q:'本文「霪雨霏霏」與「春和景明」兩段的主要作用是？',o:['單純記錄天氣變化','以景生情，形成悲喜對比，為議論鋪墊','記錄當地氣候','批評時政'],a:1,t:'寫作手法',c:'岳陽樓記',e:'兩段一悲一喜，寫出遷客騷人因景而生的兩種心情，形成對比，為後文議論古仁人的「不以物喜，不以己悲」作鋪墊。'},

/* 六國論 */
{q:'《六國論》的中心論點是？',o:['六國兵力不足','六國破滅，弊在賂秦','秦國國力強大','六國不善作戰'],a:1,t:'內容理解',c:'六國論',e:'文章開篇即提出「六國破滅，非兵不利，戰不善，弊在賂秦」，這是全文的中心論點，暗含借古諷今之意。'},
{q:'「以地事秦，猶抱薪救火」用了甚麼論證手法？',o:['比喻論證','舉例論證','引用論證','對比論證'],a:0,t:'寫作手法',c:'六國論',e:'以「抱薪救火」比喻「以地事秦」的荒謬，生動說明賄賂秦國只會加速滅亡，使抽象道理具體化，增強說服力。'},
{q:'「思厥先祖父」中「祖父」的古義是？',o:['爺爺','祖輩與父輩','泛指祖先','家族'],a:1,t:'字詞',c:'六國論',e:'「祖父」古義指祖輩與父輩，與今日專指爺爺不同，屬古今異義。此句追述先人創業之艱，與子孫賂秦之輕率形成反差。'},
{q:'「暴霜露，斬荊棘」中「暴」的意思是？',o:['暴露、冒著','殘暴','突然','曬'],a:0,t:'字詞',c:'六國論',e:'「暴」通「曝」，解作冒著。「暴霜露」即冒著風霜雨露，寫先人創業之艱，是常考通假字。'},
{q:'蘇洵寫作《六國論》的真正用意是？',o:['純粹檢討歷史','借古諷今，警告北宋勿賂敵','讚美六國的堅守','批評秦國的殘暴'],a:1,t:'內容理解',c:'六國論',e:'蘇洵借六國賂秦而亡的史實，諷刺北宋以歲幣求和的政策，警告統治者勿重蹈覆轍，體現其借古諷今的用心。'},
{q:'「下而從六國破亡之故事」中「故事」的意思是？',o:['故事傳說','舊事、前例','情節','計謀'],a:1,t:'字詞',c:'六國論',e:'「故事」古義指舊事、前例，與今日「故事」不同。此句謂重蹈六國滅亡的覆轍，是全文主旨所在。'},

/* 山居秋暝 */
{q:'「空山新雨後，天氣晚來秋」營造了甚麼氛圍？',o:['熱鬧喧囂','清幽空靈','悲涼蕭瑟','緊張壓抑'],a:1,t:'內容理解',c:'山居秋暝',e:'首聯以「空山」「新雨」點出雨後山林的清新空寂，營造清幽空靈的氛圍，其中「空」字為全詩詩眼，暗含詩人空明澄澈的心境。'},
{q:'「明月松間照，清泉石上流」用了甚麼手法？',o:['動靜結合（兼對偶）','誇張','擬人','借代'],a:0,t:'寫作手法',c:'山居秋暝',e:'此聯既是工整對偶，又是動靜結合：月光灑落為靜景，泉水流淌為動景，動靜相生，富於畫意，是「詩中有畫」的典型。'},
{q:'「竹喧歸浣女，蓮動下漁舟」中「喧」與「動」的作用是？',o:['以動襯靜','渲染熱鬧氣氛','表達悲傷之情','單純描寫聲音'],a:0,t:'寫作手法',c:'山居秋暝',e:'以竹林的喧鬧與蓮葉的晃動，反襯山居環境的幽靜，同時寫出田園生活的純樸之樂，是「以動襯靜」的典範。'},
{q:'「隨意春芳歇，王孫自可留」表達了作者？',o:['強烈思念家鄉','留戀山中、歸隱之志','感嘆時光易逝','惋惜春天離去'],a:1,t:'內容理解',c:'山居秋暝',e:'尾聯反用《楚辭》「王孫兮歸來，山中兮不可久留」之意，表達留戀山林、決意歸隱的心志，點明全詩主旨。'},
{q:'本詩的詩眼可說是哪個字？',o:['空','秋','明','留'],a:0,t:'內容理解',c:'山居秋暝',e:'「空」字統攝全詩，既寫山林的空寂清幽，也暗含詩人空明澄澈的心境，為全詩詩眼，是常考重點。'},
{q:'王維此詩體現了甚麼風格？',o:['豪放飄逸','田園山水、詩中有畫','邊塞雄渾','諷喻現實'],a:1,t:'內容理解',c:'山居秋暝',e:'王維為山水田園詩派代表，此詩寫雨後山居秋景，詩中有畫，畫中有詩，意境清幽，體現其恬淡的歸隱情懷。'},

/* 月下獨酌 */
{q:'「舉杯邀明月，對影成三人」中「三人」指？',o:['李白、明月、影子','李白與兩位朋友','三位詩人','月亮與兩個影子'],a:0,t:'內容理解',c:'月下獨酌',e:'「三人」指詩人自己、明月與影子。此句以奇特想像化孤獨為熱鬧，展現李白的浪漫曠達，是千古名句。'},
{q:'「影徒隨我身」中「徒」的意思是？',o:['徒弟','只是、白白地','徒步','徒然無功'],a:1,t:'字詞',c:'月下獨酌',e:'「徒」解作只是、白白地。全句謂影子也只是白白地跟隨我的身體，寫出伴侶的無情，是常考字詞。'},
{q:'「相期邈雲漢」中「雲漢」指？',o:['雲霧','銀河','漢朝','天空'],a:1,t:'字詞',c:'月下獨酌',e:'「雲漢」指銀河。詩人相約在遙遠的銀河相見，將孤獨昇華為永恆的精神寄託，意境高遠。'},
{q:'本詩主要抒發了作者怎樣的情感？',o:['歡樂愉悅','孤獨與超脫','愛國情懷','閒適自得'],a:1,t:'內容理解',c:'月下獨酌',e:'全詩由孤獨起筆，經邀月對影的奇想，最終相期雲漢，抒發孤獨中的曠達與超脫，展現李白浪漫曠達的個性。'},
{q:'「我歌月徘徊，我舞影零亂」用了甚麼修辭手法？',o:['擬人','誇張','借代','設問'],a:0,t:'修辭',c:'月下獨酌',e:'「月徘徊」賦予月亮以人的情態，彷彿月亮隨詩人歌唱而徘徊不去，屬擬人手法，寫出物我交融之樂。'},
{q:'「行樂須及春」反映李白怎樣的人生態度？',o:['消極避世','及時行樂、曠達自適','貪圖享樂','悲觀厭世'],a:1,t:'內容理解',c:'月下獨酌',e:'「行樂須及春」表現李白在孤獨中仍能自我排解、及時行樂的曠達情懷，是其浪漫主義人生態度的體現。'},

/* 登樓 */
{q:'「花近高樓傷客心」中「客」指？',o:['路過的客人','詩人自己（羈旅之人）','詩人的朋友','當地百姓'],a:1,t:'內容理解',c:'登樓',e:'「客」指客居他鄉的詩人自己。杜甫流寓成都，故自稱「客」，此句以樂景寫哀情，奠定全詩沉鬱基調。'},
{q:'「錦江春色來天地，玉壘浮雲變古今」用了甚麼修辭手法？',o:['對偶','排比','比喻','擬人'],a:0,t:'修辭',c:'登樓',e:'此聯為工整對偶，並以空間（天地）與時間（古今）對舉，氣象宏大，內涵深遠，是杜詩名句。'},
{q:'「北極朝廷終不改」中「北極」指？',o:['北極星，喻朝廷','極北之地','北方邊境','北極圈'],a:0,t:'字詞',c:'登樓',e:'「北極」指北極星，比喻朝廷如北極星般穩固不動，表達詩人對唐王朝的堅定信念，是常考比喻。'},
{q:'本詩的風格是？',o:['豪放飄逸','沉鬱頓挫','清新淡雅','纏綿悱惻'],a:1,t:'內容理解',c:'登樓',e:'杜甫此詩於登樓所見中寄託家國之思，情感深沉，風格沉鬱頓挫，為杜詩典型風格。'},
{q:'「可憐後主還祠廟」中「後主」指？',o:['蜀漢劉禪','陳後主','唐玄宗','南唐後主'],a:0,t:'字詞',c:'登樓',e:'「後主」指蜀漢後主劉禪。杜甫借劉禪尚有祠廟，抒發對當朝無人、國勢日衰的感慨，是借古諷今。'},
{q:'杜甫登樓所見所感，核心情感是？',o:['遊玩之樂','憂國傷時','思鄉念親','隱居之志'],a:1,t:'內容理解',c:'登樓',e:'此詩寫於萬方多難之際，詩人登樓遠望，由春色想到古今變遷，核心情感是憂國傷時，壯志難酬。'},

/* 念奴嬌 */
{q:'「大江東去，浪淘盡，千古風流人物」在詞中的作用是？',o:['寫景起興，奠定豪放基調','單純描寫長江','懷念朋友','記錄歷史'],a:0,t:'寫作手法',c:'念奴嬌·赤壁懷古',e:'以大江東去、淘盡千古人物開篇，由眼前江景引出懷古之情，氣勢磅礴，奠定全詞豪放基調。'},
{q:'「捲起千堆雪」中「雪」比喻甚麼？',o:['真雪','浪花','白雲','石頭'],a:1,t:'修辭',c:'念奴嬌·赤壁懷古',e:'「千堆雪」比喻洶湧的浪花，形象寫出浪濤之白、之盛，是比喻手法的典型運用，為常考題。'},
{q:'「羽扇綸巾」描寫的是誰？',o:['諸葛亮','周瑜','曹操','蘇軾'],a:1,t:'內容理解',c:'念奴嬌·赤壁懷古',e:'「羽扇綸巾」寫周瑜手執羽扇、頭戴綸巾的儒將裝束，表現其從容瀟灑的風度，是側面烘托的手法。'},
{q:'「人生如夢，一尊還酹江月」表達了？',o:['壯志凌雲','曠達中的感慨','極度悲傷','得意忘形'],a:1,t:'內容理解',c:'念奴嬌·赤壁懷古',e:'結句以「人生如夢」抒發對人生短暫、功業難成的感慨，但舉酒酹江月又見曠達，是曠達中的感慨，為高頻考點。'},
{q:'「檣櫓灰飛煙滅」中「檣櫓」的修辭手法是？',o:['比喻','借代','誇張','用典'],a:1,t:'修辭',c:'念奴嬌·赤壁懷古',e:'「檣櫓」以船桅和船槳借代曹軍戰船，屬借代手法，具體形象，是常考修辭。'},
{q:'《念奴嬌·赤壁懷古》屬於哪一派詞風？',o:['婉約派','豪放派','花間派','格律派'],a:1,t:'內容理解',c:'念奴嬌·赤壁懷古',e:'蘇軾此詞氣象恢宏，開豪放詞先河，與柳永、李清照的婉約詞風相對，是豪放詞的代表作。'},

/* 聲聲慢 */
{q:'「尋尋覓覓，冷冷清清，悽悽慘慘戚戚」用了甚麼修辭手法？',o:['疊字（兼排比）','比喻','誇張','借代'],a:0,t:'修辭',c:'聲聲慢',e:'十四疊字連用，由動作到環境到心境層層遞進，聲情並茂，是詞史上著名的疊字名筆，為必考題。'},
{q:'「最難將息」中「將息」的意思是？',o:['休息','調養、保重','將要','嘆息'],a:1,t:'字詞',c:'聲聲慢',e:'「將息」解作調養、保重身體。全句謂乍暖還寒的天氣最難調養身體，是常考字詞。'},
{q:'「雁過也，正傷心，卻是舊時相識」中「雁」象徵？',o:['自由自在','傳書、懷人','秋天的到來','孤獨無依'],a:1,t:'內容理解',c:'聲聲慢',e:'古有雁足傳書之說，此處大雁飛過，勾起詞人對亡夫與故國的思念，觸景傷情，是常考象徵義。'},
{q:'「滿地黃花堆積，憔悴損」中「黃花」比喻？',o:['詞人自己的憔悴','秋天的花','財富','歡樂'],a:0,t:'修辭',c:'聲聲慢',e:'黃花堆積、憔悴凋零，正是詞人自身容顏憔悴、身世飄零的寫照，物我合一，是常考比喻。'},
{q:'「怎一個愁字了得」用了甚麼句式？',o:['反問','設問','感嘆','祈使'],a:0,t:'修辭',c:'聲聲慢',e:'以反問作結，將無法言說的愁緒推向極致，言有盡而意無窮，是全詞的點睛之筆，為高頻考點。'},
{q:'《聲聲慢》表達的核心情感是？',o:['國破家亡、夫死漂泊之愁','相思相戀之樂','閒適恬淡之情','懷古傷今之思'],a:0,t:'內容理解',c:'聲聲慢',e:'李清照晚年經歷國破、家亡、夫死、漂泊，全詞層層鋪寫的正是這種深重難言的愁緒，是婉約詞的代表作。'},

/* 青玉案 */
{q:'「東風夜放花千樹」描寫的是甚麼景象？',o:['春天百花盛開','元宵燈火璀璨','秋天落葉紛飛','雨夜的景象'],a:1,t:'內容理解',c:'青玉案·元夕',e:'此句以「花千樹」比喻元宵夜璀璨的燈火，寫出燈會之盛，並非真的春花，是常考比喻。'},
{q:'「一夜魚龍舞」中「魚龍舞」指？',o:['真魚真龍起舞','魚龍形的花燈舞動','雜技舞蹈','水上表演'],a:1,t:'字詞',c:'青玉案·元夕',e:'「魚龍舞」指魚龍形狀的花燈在夜中舞動，寫元宵燈會的熱鬧場面，是常考字詞。'},
{q:'「驀然回首」中「驀然」的意思是？',o:['慢慢地','突然','傷心地','高興地'],a:1,t:'字詞',c:'青玉案·元夕',e:'「驀然」解作突然。「驀然回首」即猛然回頭，寫出尋覓後的意外驚喜，是常考字詞。'},
{q:'「燈火闌珊處」中「闌珊」的意思是？',o:['燦爛輝煌','零落、稀疏','熱鬧非凡','遙遠難及'],a:1,t:'字詞',c:'青玉案·元夕',e:'「闌珊」解作零落、稀疏。「燈火闌珊處」即燈火稀疏冷清的地方，與前面的熱鬧形成反襯。'},
{q:'「那人卻在，燈火闌珊處」中「那人」象徵？',o:['一位美人','作者理想的人格或政治抱負','作者的朋友','路過的陌生人'],a:1,t:'內容理解',c:'青玉案·元夕',e:'「那人」在熱鬧之外、燈火冷清處，象徵詞人不趨流俗、自甘寂寞的高潔人格與政治理想，是高頻考點。'},
{q:'《青玉案·元夕》主要運用了甚麼手法？',o:['以樂景反襯（熱鬧反襯冷清）','直抒胸臆','誇張','擬人'],a:0,t:'寫作手法',c:'青玉案·元夕',e:'全詞極寫元宵燈火的熱鬧繁華，最後卻歸於「燈火闌珊處」的冷清，以熱鬧反襯「那人」的孤高，境界陡轉。'},

/* 跨篇章 */
{q:'《魚我所欲也》的「捨生取義」與《岳陽樓記》的「先天下之憂而憂」共同體現了？',o:['道家超脫精神','儒家淑世擔當的價值取向','法家的功利思想','佛家的出世情懷'],a:1,t:'跨篇比較',c:'跨篇章',e:'兩者同屬儒家價值系統：前者重道義高於生命，後者重天下先於個人，皆體現淑世擔當的精神。'},

/* =========================================================
   工具函式
   ========================================================= */
const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('wm_'+k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('wm_'+k, JSON.stringify(v)); }catch(e){} }
};
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const $ = s => document.querySelector(s);
QUESTIONS.forEach((q,i)=>{ q.id = 'q'+i; });

const state = {
  view:'read', chapter:0, pFilter:'all', pPool:[], pIdx:0, pAnswered:false
};

function switchView(v){
  state.view = v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  $('#view-'+v).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
  if(v==='practice') renderPractice();
  if(v==='notes') renderNotes();
  if(v==='stats') renderStats();
  if(v==='framework') renderFramework();
}

function countSentences(c){ return c.sections.reduce((a,s)=>a+s.sentences.length,0); }

function renderSidebar(){
  const el = $('#sidebar');
  el.innerHTML = '<div class="sb-title">十六篇指定篇章</div>' +
    CHAPTERS.map((c,i)=>`
      <div class="chap-item ${i===state.chapter?'on':''}" onclick="selectChapter(${i})">
        <div class="ci-num">${c.num}</div>
        <div class="ci-body">
          <div class="ci-title">${esc(c.title)}</div>
          <div class="ci-sub">${esc(c.author)} · ${esc(c.genre)}</div>
        </div>
      </div>`).join('');
}

function selectChapter(i){
  state.chapter = i;
  renderSidebar();
  renderReader();
  const c = $('#readerContent');
  if(c) c.scrollIntoView({behavior:'smooth',block:'start'});
  if(window.innerWidth<=900) window.scrollTo({top:0,behavior:'smooth'});
}

function markWords(text, words){
  if(!words || !words.length) return esc(text);
  const occupied = new Array(text.length).fill(false);
  const marks = [];
  const sorted = [...words].sort((a,b)=>b.w.length-a.w.length);
  sorted.forEach(item=>{
    if(!item.w) return;
    let idx = text.indexOf(item.w);
    while(idx !== -1){
      let ok = true;
      for(let k=idx;k<idx+item.w.length;k++){ if(occupied[k]){ ok=false; break; } }
      if(ok){
        for(let k=idx;k<idx+item.w.length;k++) occupied[k]=true;
        marks.push({s:idx,e:idx+item.w.length,item});
        break;
      }
      idx = text.indexOf(item.w, idx+1);
    }
  });
  marks.sort((a,b)=>a.s-b.s);
  let html='', pos=0;
  marks.forEach(m=>{
    if(m.s < pos) return;
    html += esc(text.slice(pos, m.s));
    html += `<span class="w" data-d="${esc(m.item.d)}" data-deep="${esc(m.item.deep||'')}" data-py="${esc(m.item.py||'')}" data-pos="${esc(m.item.pos||'')}" data-w="${esc(m.item.w)}">${esc(text.slice(m.s,m.e))}</span>`;
    pos = m.e;
  });
  html += esc(text.slice(pos));
  return html;
}

function renderReader(){
  const c = CHAPTERS[state.chapter];
  const readMap = LS.get('read', {});
  const readArr = readMap[c.id] || [];

  let html = `
  <div class="ch-head">
    <h2 class="kai">${esc(c.title)}</h2>
    <div class="ch-meta">
      <span>${esc(c.author)}</span><span>${esc(c.era)}</span>
      <span>${esc(c.genre)}</span><span>${esc(c.theme)}</span>
      <span>共 ${countSentences(c)} 句</span>
    </div>
    <div class="ch-intro">${esc(c.intro)}</div>
  </div>`;

  let gi = 0;
  c.sections.forEach(sec=>{
    html += `<div class="sec-name">${esc(sec.name)}</div>`;
    sec.sentences.forEach(s=>{
      const key = c.id+'-'+gi;
      const isRead = readArr.includes(key);
      const tags = [];
      if(s.rhet && s.rhet.length) s.rhet.forEach(r=>tags.push(`<span class="tag tag-rhet">修辭 · ${esc(r.t)}</span>`));
      if(s.tech) tags.push(`<span class="tag tag-tech">手法</span>`);
      if(s.symbol) tags.push(`<span class="tag tag-sym">象徵</span>`);
      if(s.emotion) tags.push(`<span class="tag tag-emo">情感</span>`);
      if(s.deep) tags.push(`<span class="tag tag-deep">深層</span>`);
      if(s.point) tags.push(`<span class="tag tag-point">考點</span>`);

      let detail = '';

      /* 字詞精練 */
      if(s.words && s.words.length){
        detail += `<div class="an-block an-tech"><div class="an-title">字詞精練</div><div class="word-grid">${
          s.words.map(w=>`
            <div class="word-item">
              <div class="word-head">
                <b>${esc(w.w)}</b>
                ${w.py?`<span class="py">${esc(w.py)}</span>`:''}
                ${w.pos?`<span class="pos">${esc(w.pos)}</span>`:''}
              </div>
              <div class="word-def">${esc(w.d)}</div>
              ${w.deep?`<div class="word-deep"><b>深層：</b>${esc(w.deep)}</div>`:''}
            </div>`).join('')
        }</div></div>`;
      }

      /* 修辭分析 */
      if(s.rhet && s.rhet.length){
        let r = '';
        s.rhet.forEach(x=>{
          r += `<div style="margin-bottom:8px;"><b style="color:#B23A2C;">${esc(x.t)}</b>｜「${esc(x.p)}」<br>${esc(x.e)}</div>`;
        });
        detail += `<div class="an-block an-rhet"><div class="an-title">修辭分析</div>${r}</div>`;
      }

      /* 寫作手法 */
      if(s.tech){
        detail += `<div class="an-block an-tech"><div class="an-title">寫作手法</div>${esc(s.tech)}</div>`;
      }

      /* 象徵意義 */
      if(s.symbol){
        detail += `<div class="an-block an-sym"><div class="an-title">象徵意義</div>${esc(s.symbol)}</div>`;
      }

      /* 背後情感 */
      if(s.emotion){
        detail += `<div class="an-block an-emo"><div class="an-title">背後情感</div>${esc(s.emotion)}</div>`;
      }

      /* 深層分析 */
      if(s.deep){
        detail += `<div class="an-block an-deep"><div class="an-title">深層分析</div>${esc(s.deep)}</div>`;
      }

      /* 考點提示 */
      if(s.point){
        detail += `<div class="an-block an-point"><div class="an-title">考點提示</div>${esc(s.point)}</div>`;
      }

      html += `
      <div class="sentence ${isRead?'':'unread'}" data-key="${key}" onclick="toggleSentence(this, '${key}')">
        <div class="s-text">${markWords(s.text, s.words)}</div>
        <div class="s-trans"><b style="color:#2E6B62;">語譯：</b>${esc(s.trans)}</div>
        <div class="s-tags">${tags.join('')}</div>
        <div class="s-detail">${detail}</div>
      </div>`;
      gi++;
    });
  });

  $('#readerContent').innerHTML = html;
  updateWordPop();
}

function toggleSentence(el, key){
  el.classList.toggle('open');
  const c = CHAPTERS[state.chapter];
  const readMap = LS.get('read', {});
  if(!readMap[c.id]) readMap[c.id] = [];
  if(el.classList.contains('open')){
    if(!readMap[c.id].includes(key)) readMap[c.id].push(key);
  }
  LS.set('read', readMap);
}

function updateWordPop(){
  const pop = $('#wpop');
  document.querySelectorAll('.w').forEach(w=>{
    w.addEventListener('click', e=>{
      e.stopPropagation();
      const deep = w.dataset.deep ? `<div class="wp-deep"><b>深層：</b>${esc(w.dataset.deep)}</div>` : '';
      const py = w.dataset.py ? ` <span style="color:#9A8B6E;font-size:11px;">${esc(w.dataset.py)}</span>` : '';
      const pos = w.dataset.pos ? ` <span style="background:#3A352E;color:#C9A96E;font-size:10px;padding:1px 6px;border-radius:4px;">${esc(w.dataset.pos)}</span>` : '';
      pop.innerHTML = `<b>${esc(w.dataset.w)}</b>${py}${pos}<div style="margin-top:3px;">${esc(w.dataset.d)}</div>${deep}`;
      pop.style.display='block';
      const r = w.getBoundingClientRect();
      let left = r.left + r.width/2 - 135;
      left = Math.max(10, Math.min(left, window.innerWidth-280));
      let top = r.bottom + 8;
      if(top + 120 > window.innerHeight) top = r.top - 110;
      pop.style.left = left+'px';
      pop.style.top = top+'px';
    });
  });
}
document.addEventListener('click', e=>{ if(!e.target.classList.contains('w')) $('#wpop').style.display='none'; });
window.addEventListener('scroll', ()=>{ $('#wpop').style.display='none'; }, true);

/* =========================================================
   練習
   ========================================================= */
function buildPool(){
  let pool = QUESTIONS.slice();
  if(state.pFilter !== 'all'){
    pool = pool.filter(q => q.t === state.pFilter || q.c === state.pFilter);
  }
  return pool;
}

function renderPractice(){
  const types = ['all','字詞','修辭','寫作手法','內容理解','跨篇比較'];
  $('#pFilters').innerHTML = types.map(t=>
    `<button class="chip ${state.pFilter===t?'on':''}" onclick="setPFilter('${t}')">${t==='all'?'全部題型':t}</button>`
  ).join('');

  if(state.pPool.length === 0 || state.pIdx >= state.pPool.length){
    state.pPool = buildPool(); state.pIdx = 0; state.pAnswered = false;
  }
  renderQuestion();
}

function setPFilter(f){
  state.pFilter = f; state.pPool = buildPool(); state.pIdx = 0; state.pAnswered = false;
  renderPractice();
}

function renderQuestion(){
  const pool = state.pPool;
  const q = pool[state.pIdx];
  const stats = LS.get('stats', {});
  const total = Object.keys(stats).length;
  const correct = Object.values(stats).filter(v=>v===1).length;

  if(!q){ $('#pBody').innerHTML = '<div class="empty">此分類暫無題目</div>'; return; }

  const typeCls = q.t==='修辭'?'tag-rhet':(q.t==='寫作手法'?'tag-tech':(q.t==='跨篇比較'?'tag-sym':'tag-point'));

  $('#pBody').innerHTML = `
  <div class="p-card">
    <div class="p-top">
      <span class="tag ${typeCls}">${esc(q.t)}</span>
      <span class="tag tag-tech">${esc(q.c)}</span>
      <span class="p-prog">第 ${state.pIdx+1} / ${pool.length} 題</span>
    </div>
    <div class="p-q">${esc(q.q)}</div>
    <div id="opts">
      ${q.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answerQ(${i})">
        <span class="opt-key">${'ABCD'[i]}</span><span>${esc(o)}</span>
      </button>`).join('')}
    </div>
    <div class="p-exp" id="pExp"><b>解析：</b>${esc(q.e)}</div>
    <div class="p-foot">
      <button class="btn btn-primary" id="btnNext" style="display:none" onclick="nextQ()">
        ${state.pIdx+1>=pool.length?'重新開始':'下一題 →'}
      </button>
      <button class="btn btn-ghost" onclick="resetStats()">清除練習記錄</button>
      <div class="p-score">已答 <b>${total}</b> 題 · 正確率 <b>${total?Math.round(correct/total*100):0}%</b></div>
    </div>
  </div>`;
  state.pAnswered = false;
}

function answerQ(i){
  if(state.pAnswered) return;
  state.pAnswered = true;
  const q = state.pPool[state.pIdx];
  document.querySelectorAll('#opts .opt').forEach((el,idx)=>{
    el.classList.add('done');
    if(idx === q.a) el.classList.add('right');
    if(idx === i && i !== q.a) el.classList.add('wrong');
  });
  $('#pExp').classList.add('on');
  $('#btnNext').style.display = 'inline-block';
  const stats = LS.get('stats', {});
  stats[q.id] = (i === q.a) ? 1 : 0;
  LS.set('stats', stats);
}

function nextQ(){
  state.pIdx++;
  if(state.pIdx >= state.pPool.length){ state.pIdx = 0; state.pPool = buildPool(); }
  renderQuestion();
}

function resetStats(){
  if(confirm('確定清除所有練習記錄？')){ LS.set('stats', {}); renderQuestion(); }
}

let noteTimer = null;
function saveNote(id, el){
  const notes = LS.get('notes', {});
  notes[id] = el.value;
  LS.set('notes', notes);
  const h = $('#hint-'+id);
  h.classList.add('on');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>h.classList.remove('on'), 1200);
}

/* =========================================================
   統計
   ========================================================= */
function renderStats(){
  const readMap = LS.get('read', {});
  const stats = LS.get('stats', {});
  const totalS = CHAPTERS.reduce((a,c)=>a+countSentences(c),0);
  let readN = 0;
  CHAPTERS.forEach(c=>{ readN += (readMap[c.id]||[]).length; });
  const answered = Object.keys(stats).length;
  const correct = Object.values(stats).filter(v=>v===1).length;
  const rate = answered ? Math.round(correct/answered*100) : 0;

  const byType = {};
  QUESTIONS.forEach(q=>{
    if(!byType[q.t]) byType[q.t] = {n:0, c:0};
    if(stats[q.id] !== undefined){ byType[q.t].n++; if(stats[q.id]===1) byType[q.t].c++; }
  });

  const chapRows = CHAPTERS.map(c=>{
    const t = countSentences(c);
    const r = (readMap[c.id]||[]).length;
    return {name:c.title, t, r};
  });

  let html = `
  <div class="stat-grid">
    <div class="stat-box"><div class="num">${readN}<small> / ${totalS}</small></div><div class="lbl">已精讀句數</div></div>
    <div class="stat-box"><div class="num">${answered}</div><div class="lbl">累計答題</div></div>
    <div class="stat-box"><div class="num">${rate}<small>%</small></div><div class="lbl">整體正確率</div></div>
    <div class="stat-box"><div class="num">${Math.round(readN/totalS*100)}<small>%</small></div><div class="lbl">精讀完成度</div></div>
  </div>

  <div class="panel">
    <h3>各題型正確率</h3>
    ${Object.keys(byType).length ? Object.entries(byType).map(([k,v])=>{
      const p = v.n ? Math.round(v.c/v.n*100) : 0;
      return `<div class="bar-row">
        <div class="bar-lbl">${esc(k)}</div>
        <div class="bar-track"><div class="bar-fill ${p<60?'low':''}" style="width:${p}%"></div></div>
        <div class="bar-val">${p}% (${v.c}/${v.n})</div>
      </div>`;
    }).join('') : '<div class="empty">尚未作答任何題目</div>'}
  </div>

  <div class="panel">
    <h3>各篇精讀進度</h3>
    ${chapRows.map(r=>{
      const p = Math.round(r.r/r.t*100);
      return `<div class="bar-row">
        <div class="bar-lbl" style="width:130px;font-size:12px;">${esc(r.name)}</div>
        <div class="bar-track"><div class="bar-fill ${p<50?'low':''}" style="width:${p}%"></div></div>
        <div class="bar-val">${r.r}/${r.t}</div>
      </div>`;
    }).join('')}
  </div>`;

  $('#statsBody').innerHTML = html;
}

/* =========================================================
   初始化
   ========================================================= */
renderSidebar();
renderReader();
renderFramework();
</script>
</body>
</html>
