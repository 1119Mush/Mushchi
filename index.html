<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文脈 · DSE 中文十六篇指定精讀</title>
<style>
:root{
  --paper:#F8F4EC;
  --paper2:#FFFDF8;
  --ink:#1A1A1A;
  --ink2:#5A5040;
  --cinnabar:#C0392B;
  --jade:#7BA9A2;
  --gold:#C9A96E;
  --line:#E6DCCB;
  --shadow:0 2px 10px rgba(90,70,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:var(--paper);
  background-image:radial-gradient(circle at 20% 10%, rgba(201,169,110,.06) 0%, transparent 45%),
                   radial-gradient(circle at 85% 80%, rgba(123,169,162,.05) 0%, transparent 40%);
  color:var(--ink);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.kai{font-family:"Kaiti","KaiTi","STKaiti","DFKai-SB","Songti TC",serif;}

/* ---------- HEADER ---------- */
header{
  position:sticky;top:0;z-index:120;
  background:rgba(248,244,236,.94);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.hd-inner{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;gap:20px;
  padding:12px 20px;
}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.logo-seal{
  width:36px;height:36px;border-radius:8px;
  background:var(--cinnabar);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:"Kaiti","KaiTi",serif;font-size:20px;font-weight:700;
  box-shadow:0 2px 6px rgba(192,57,43,.3);
  letter-spacing:-1px;
}
.logo-txt h1{font-size:17px;font-weight:700;letter-spacing:2px;line-height:1.2;}
.logo-txt p{font-size:10.5px;color:var(--ink2);letter-spacing:.5px;line-height:1.2;}
nav.tabs{margin-left:auto;display:flex;gap:4px;background:#EFE8DA;padding:4px;border-radius:10px;}
nav.tabs button{
  border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:14px;color:var(--ink2);
  padding:7px 16px;border-radius:7px;transition:.2s;font-weight:500;
}
nav.tabs button:hover{color:var(--ink);}
nav.tabs button.on{background:#fff;color:var(--cinnabar);box-shadow:var(--shadow);font-weight:700;}

/* ---------- VIEWS ---------- */
.view{display:none;}
.view.on{display:block;}

/* ---------- READER ---------- */
.reader{display:flex;max-width:1280px;margin:0 auto;align-items:flex-start;}
.sidebar{
  width:250px;flex-shrink:0;
  padding:18px 12px 60px;
  position:sticky;top:65px;
  max-height:calc(100vh - 65px);
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:5px;}
.sidebar::-webkit-scrollbar-thumb{background:#DDD2BE;border-radius:4px;}
.sb-title{
  font-size:11px;letter-spacing:2px;color:var(--ink2);
  padding:0 8px 10px;font-weight:600;
}
.chap-item{
  display:flex;align-items:flex-start;gap:9px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  transition:.16s;margin-bottom:2px;
}
.chap-item:hover{background:#F1EADC;}
.chap-item.on{background:#fff;box-shadow:var(--shadow);}
.chap-item.on .ci-num{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);}
.ci-num{
  flex-shrink:0;width:21px;height:21px;border-radius:5px;
  border:1px solid var(--line);background:#FBF7EF;
  font-size:11px;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-weight:700;margin-top:2px;
}
.ci-body{min-width:0;}
.ci-title{font-size:13.5px;font-weight:600;line-height:1.4;color:var(--ink);}
.ci-sub{font-size:11px;color:#998E7B;margin-top:1px;}

.content{flex:1;min-width:0;padding:22px 26px 100px;max-width:920px;}

/* chapter header */
.ch-head{
  background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:22px 26px;margin-bottom:20px;position:relative;overflow:hidden;
}
.ch-head::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--cinnabar),var(--gold));
}
.ch-head h2{font-size:24px;letter-spacing:2px;margin-bottom:6px;}
.ch-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.ch-meta span{
  font-size:11.5px;padding:2px 10px;border-radius:20px;
  background:#F2EADC;color:#7A6A4E;border:1px solid #E6D9BF;
}
.ch-intro{font-size:13.5px;color:var(--ink2);line-height:1.85;}

.sec-name{
  font-family:"Kaiti","KaiTi",serif;
  font-size:16px;color:var(--cinnabar);letter-spacing:2px;
  margin:26px 0 12px;padding-left:12px;
  border-left:3px solid var(--cinnabar);
}

/* sentence card */
.sentence{
  background:var(--paper2);border:1px solid var(--line);border-radius:11px;
  padding:14px 18px 13px;margin-bottom:11px;cursor:pointer;
  transition:.18s;position:relative;
}
.sentence:hover{border-color:#DBC99E;box-shadow:0 2px 12px rgba(160,130,70,.08);}
.sentence.open{border-color:var(--gold);box-shadow:0 3px 16px rgba(160,130,70,.11);}
.s-text{
  font-family:"Kaiti","KaiTi","STKaiti","DFKai-SB",serif;
  font-size:18.5px;line-height:2.05;color:#241F19;letter-spacing:.5px;
}
.s-trans{
  font-size:13.5px;color:#3E6B63;line-height:1.8;
  margin-top:9px;padding:8px 12px;background:#F0F6F4;border-radius:7px;
  border-left:3px solid var(--jade);
  display:none;
}
.sentence.open .s-trans{display:block;}
.s-tags{display:flex;flex-wrap:wrap;gap:0;margin-top:7px;}
.tag{
  display:inline-block;font-size:11px;padding:1.5px 9px;border-radius:20px;
  margin:3px 6px 0 0;line-height:1.6;
}
.tag-rhet{background:#FDECEA;color:#B23A2C;border:1px solid #F2C8C2;}
.tag-tech{background:#EAF4F2;color:#2E6B62;border:1px solid #C5E0DC;}
.tag-point{background:#FBF4E6;color:#8A6A2F;border:1px solid #EAD9B5;}
.s-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.sentence.open .s-detail{display:block;}
.d-row{display:flex;gap:10px;margin-bottom:9px;font-size:13px;line-height:1.8;}
.d-key{
  flex-shrink:0;width:64px;font-size:11.5px;font-weight:700;
  color:#9A8B6E;letter-spacing:1px;padding-top:2px;
}
.d-val{flex:1;color:var(--ink2);}
.d-val b{color:var(--cinnabar);font-weight:600;}
.word-chip{
  display:inline-block;background:#FBF4E6;border:1px solid #EAD9B5;
  border-radius:5px;padding:0 7px;margin:2px 5px 2px 0;font-size:12.5px;
}
.word-chip i{font-style:normal;color:var(--cinnabar);font-weight:700;margin-right:4px;}
.w{
  border-bottom:1.5px dashed var(--gold);
  color:#8A5A2B;cursor:help;transition:.15s;padding-bottom:1px;
}
.w:hover{background:#FFF2D6;border-radius:3px;}

/* word popup */
#wpop{
  position:fixed;z-index:300;max-width:250px;
  background:#26221C;color:#F5EFE3;font-size:13px;line-height:1.65;
  padding:9px 13px;border-radius:9px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);
  display:none;pointer-events:none;
}
#wpop b{color:#F0C36A;display:block;font-size:13.5px;margin-bottom:2px;}

/* ---------- PRACTICE ---------- */
.practice-wrap{max-width:800px;margin:0 auto;padding:24px 20px 100px;}
.p-filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
.chip{
  font-size:12.5px;padding:5px 14px;border-radius:20px;
  border:1px solid var(--line);background:var(--paper2);
  cursor:pointer;transition:.16s;font-family:inherit;color:var(--ink2);
}
.chip:hover{border-color:var(--gold);}
.chip.on{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);font-weight:600;}

.p-card{
  background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  padding:24px 26px;box-shadow:var(--shadow);
}
.p-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.p-top .tag{margin:0;}
.p-prog{margin-left:auto;font-size:12px;color:#A2967F;font-weight:600;letter-spacing:.5px;}
.p-q{font-size:16px;line-height:1.85;margin-bottom:18px;color:#231E18;font-weight:500;}
.p-q .kai{font-size:17.5px;}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:#FCFAF5;border:1px solid var(--line);border-radius:9px;
  padding:11px 15px;margin-bottom:9px;cursor:pointer;
  font-family:inherit;font-size:14px;color:#332D25;line-height:1.7;
  transition:.16s;
}
.opt:hover:not(.done){border-color:var(--gold);background:#FFFBF0;}
.opt-key{
  flex-shrink:0;width:22px;height:22px;border-radius:6px;
  background:#EFE7D7;color:#8A7A5C;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.opt.right{background:#EAF6F0;border-color:#7FBFA0;}
.opt.right .opt-key{background:#4E9E78;color:#fff;}
.opt.wrong{background:#FDEDEB;border-color:#E5A79E;}
.opt.wrong .opt-key{background:#C0392B;color:#fff;}
.opt.done{cursor:default;}
.p-exp{
  display:none;margin-top:16px;padding:14px 17px;
  background:#FBF6EA;border-left:3px solid var(--gold);border-radius:0 9px 9px 0;
  font-size:13.5px;line-height:1.85;color:#4A4133;
}
.p-exp.on{display:block;}
.p-exp b{color:var(--cinnabar);}
.p-foot{display:flex;align-items:center;gap:12px;margin-top:18px;}
.btn{
  font-family:inherit;font-size:13.5px;font-weight:600;
  padding:9px 24px;border-radius:9px;border:none;cursor:pointer;transition:.16s;
}
.btn-primary{background:var(--cinnabar);color:#fff;box-shadow:0 2px 8px rgba(192,57,43,.25);}
.btn-primary:hover{background:#A93226;}
.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--gold);color:var(--ink);}
.p-score{margin-left:auto;font-size:13px;color:var(--ink2);font-weight:600;}
.p-score b{color:var(--cinnabar);font-size:16px;}

/* ---------- NOTES ---------- */
.notes-wrap{max-width:900px;margin:0 auto;padding:24px 20px 100px;}
.note-card{
  background:var(--paper2);border:1px solid var(--line);border-radius:12px;
  padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow);
}
.note-card h4{font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px;}
.note-card h4 .ci-num{margin:0;}
.note-card h4 span{font-size:11px;color:#A2967F;font-weight:400;}
.note-card textarea{
  width:100%;min-height:76px;resize:vertical;
  border:1px solid var(--line);border-radius:8px;
  padding:10px 13px;font-family:inherit;font-size:13.5px;line-height:1.8;
  background:#FCFAF5;color:var(--ink);outline:none;transition:.16s;
}
.note-card textarea:focus{border-color:var(--gold);background:#fff;}
.save-hint{font-size:11px;color:#4E9E78;opacity:0;transition:.3s;margin-top:5px;}
.save-hint.on{opacity:1;}

/* ---------- STATS ---------- */
.stats-wrap{max-width:900px;margin:0 auto;padding:24px 20px 100px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
.stat-box{
  background:var(--paper2);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;box-shadow:var(--shadow);
}
.stat-box .num{font-size:28px;font-weight:700;color:var(--cinnabar);line-height:1.2;font-family:"Kaiti",serif;}
.stat-box .num small{font-size:14px;color:#B5AA96;font-weight:400;}
.stat-box .lbl{font-size:12px;color:var(--ink2);margin-top:3px;letter-spacing:.5px;}
.panel{
  background:var(--paper2);border:1px solid var(--line);border-radius:12px;
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);
}
.panel h3{font-size:14.5px;margin-bottom:16px;letter-spacing:1px;color:#3A3227;}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:13px;}
.bar-lbl{width:80px;flex-shrink:0;color:var(--ink2);}
.bar-track{flex:1;height:9px;background:#EFE8DA;border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--jade),#4E9E78);transition:width .5s;}
.bar-fill.low{background:linear-gradient(90deg,#E5A79E,var(--cinnabar));}
.bar-val{width:56px;text-align:right;color:#8A7A5C;font-size:12px;flex-shrink:0;}
.empty{text-align:center;color:#B5AA96;font-size:13.5px;padding:40px 0;}

@media (max-width:860px){
  .hd-inner{padding:10px 14px;gap:10px;}
  .logo-txt p{display:none;}
  nav.tabs button{padding:6px 11px;font-size:13px;}
  .reader{flex-direction:column;}
  .sidebar{
    width:100%;position:static;max-height:none;
    display:flex;gap:7px;overflow-x:auto;
    border-bottom:1px solid var(--line);
    padding:11px 12px;
  }
  .sidebar::-webkit-scrollbar{height:0;}
  .sb-title{display:none;}
  .chap-item{
    flex-shrink:0;background:var(--paper2);border:1px solid var(--line);
    padding:6px 12px;margin:0;
  }
  .chap-item .ci-num{display:none;}
  .ci-sub{display:none;}
  .ci-title{font-size:12.5px;white-space:nowrap;}
  .content{padding:16px 14px 90px;}
  .ch-head{padding:18px 18px;}
  .ch-head h2{font-size:20px;}
  .s-text{font-size:17px;}
  .p-card{padding:18px 16px;}
  .p-q{font-size:15px;}
  .opt{font-size:13.5px;padding:10px 12px;}
  .logo-txt h1{font-size:15px;}
}
</style>
</head>
<body>

<header>
  <div class="hd-inner">
    <div class="logo" onclick="switchView('read')">
      <div class="logo-seal">文</div>
      <div class="logo-txt">
        <h1>文脈</h1>
        <p>DSE 中文十六篇 · 逐句精讀</p>
      </div>
    </div>
    <nav class="tabs">
      <button data-v="read" class="on" onclick="switchView('read')">精讀</button>
      <button data-v="practice" onclick="switchView('practice')">練習</button>
      <button data-v="notes" onclick="switchView('notes')">筆記</button>
      <button data-v="stats" onclick="switchView('stats')">統計</button>
    </nav>
  </div>
</header>

<!-- ============ 精讀 ============ -->
<section id="view-read" class="view on">
  <div class="reader">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="readerContent"></main>
  </div>
</section>

<!-- ============ 練習 ============ -->
<section id="view-practice" class="view">
  <div class="practice-wrap">
    <div class="p-filters" id="pFilters"></div>
    <div id="pBody"></div>
  </div>
</section>

<!-- ============ 筆記 ============ -->
<section id="view-notes" class="view">
  <div class="notes-wrap">
    <div class="panel" style="margin-bottom:18px;">
      <h3>📝 我的筆記本</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;">
        為每篇範文記下你的理解、答題框架與易錯點。內容自動儲存於本機瀏覽器，離線亦可溫習。
      </p>
    </div>
    <div id="notesBody"></div>
  </div>
</section>

<!-- ============ 統計 ============ -->
<section id="view-stats" class="view">
  <div class="stats-wrap" id="statsBody"></div>
</section>

<div id="wpop"></div>

<script>
/* =========================================================
   數據層
   ========================================================= */
const CHAPTERS = [
{
  id:'lunyu', num:1, title:'論仁、論孝、論君子', author:'論語', era:'先秦', genre:'語錄體', theme:'儒家修養',
  intro:'《論語》是孔子與弟子言論的結集。本篇選錄「論仁」「論孝」「論君子」三組章節，從愛人、知人、殺身成仁，到敬養父母、義利之辨，勾勒出儒家修身的核心輪廓。',
  sections:[
  { name:'論仁', sentences:[
    { text:'樊遲問仁。子曰：「愛人。」問知。子曰：「知人。」',
      trans:'樊遲問甚麼是仁。孔子說：「愛人。」又問甚麼是智。孔子說：「了解人。」',
      words:[{w:'仁',d:'仁愛，儒家最高的道德準則'},{w:'知',d:'同「智」，智慧、見識'}],
      rhet:[], tech:'語錄問答體——以弟子問、孔子答的簡潔對話，直接點明概念內涵',
      point:'「仁＝愛人」是必背定義，常考與「知＝知人」的分別' },
    { text:'子曰：「志士仁人，無求生以害仁，有殺身以成仁。」',
      trans:'孔子說：「有志之士和仁德之人，不會為了保全性命而損害仁德，只會犧牲生命來成全仁德。」',
      words:[{w:'志士',d:'有志向節操的人'},{w:'害',d:'損害、妨害'},{w:'殺身',d:'犧牲生命'},{w:'成',d:'成全、成就'}],
      rhet:[{t:'對偶',p:'無求生以害仁／有殺身以成仁',e:'正反相對，鏗鏘有力，突出仁高於生命的價值取向'}],
      tech:'正反對照——以「無……有……」的句式並列兩種取捨',
      point:'「殺身成仁」成語出處，與《魚我所欲也》「捨生取義」並考' },
    { text:'子曰：「君子喻於義，小人喻於利。」',
      trans:'孔子說：「君子明白的是道義，小人明白的是利益。」',
      words:[{w:'喻',d:'明白、通曉'},{w:'義',d:'合宜的道德準則'},{w:'利',d:'私利、利益'}],
      rhet:[{t:'對偶',p:'君子喻於義／小人喻於利',e:'句式整齊，君子與小人對舉，界限分明'}],
      tech:'對比論證——以君子、小人之別確立義利之辨',
      point:'「義利之辨」是儒家核心命題，常與《魚我所欲也》連考' }
  ]},
  { name:'論孝', sentences:[
    { text:'子游問孝。子曰：「今之孝者，是謂能養。至於犬馬，皆能有養；不敬，何以別乎？」',
      trans:'子游問甚麼是孝。孔子說：「如今所謂的孝，只是說能養活父母。但狗馬也都能得到飼養；如果沒有恭敬之心，那和飼養狗馬有甚麼分別呢？」',
      words:[{w:'養',d:'供養、飼養'},{w:'敬',d:'恭敬之心'},{w:'別',d:'分別、區別'}],
      rhet:[{t:'反問',p:'不敬，何以別乎？',e:'以反問強調「敬」才是孝的本質，語氣加強，發人深省'}],
      tech:'對比論證——以「養犬馬」與「養父母」對比，凸顯「敬」的關鍵',

    { text:'子曰：「事父母幾諫，見志不從，又敬不違，勞而不怨。」',
      trans:'孔子說：「侍奉父母，要委婉地勸諫；看到自己的意見不被聽從，仍然要恭敬而不違逆，雖然憂愁但不怨恨。」',

  { name:'論君子', sentences:[

{q:'「青，取之於藍，而青於藍」用了甚麼論證手法？',o:['比喻論證','舉例論證','對比論證','引用論證'],a:0,t:'寫作手法',c:'勸學',e:'以靛青從藍草提取卻比藍草更青，比喻學習能使人超越本源，屬比喻論證。'},
{q:'「木直中繩，輮以為輪」中「中」的意思是？',o:['中間','符合','集中','中等'],a:1,t:'字詞',c:'勸學',e:'「中」解作符合。「中繩」即合乎墨線，形容木材筆直。'},
{q:'「君子生非異也」中「生」通假為哪個字？',o:['性','勝','聲','甥'],a:0,t:'字詞',c:'勸學',e:'「生」通「性」，指天性、資質。全句謂君子的天性與常人並無不同，只是善於借助外物。'},
{q:'「鍥而不捨，金石可鏤」說明甚麼道理？',o:['金石可以雕刻','堅持不懈的重要','工具的重要','學習的痛苦'],a:1,t:'內容理解',c:'勸學',e:'此句以雕刻為喻，說明只要堅持不懈，即使堅硬的金石也能雕鏤，強調持之以恆。'},
{q:'荀子認為學習最終可以達到的效果是？',o:['改變本性、知明而行無過','升官發財','超脫生死','遠離世俗'],a:0,t:'內容理解',c:'勸學',e:'荀子謂「君子博學而日參省乎己，則知明而行無過矣」，認為學習能改變本性、提升智慧、端正行為。'},

/* 廉頗藺相如列傳 */
{q:'「臣請完璧歸趙」中「完」的用法是？',o:['完成','使動用法，使……完好無損','結束','修補'],a:1,t:'字詞',c:'廉頗藺相如列傳',e:'「完」在此為使動用法，「完璧」即「使璧完好無損」地帶回趙國。'},
{q:'「怒髮上衝冠」用了甚麼修辭手法？',o:['誇張','比喻','擬人','排比'],a:0,t:'修辭',c:'廉頗藺相如列傳',e:'以頭髮豎起頂起帽子的誇張描寫，將藺相如內心的極度憤怒外化為具體形象，極具感染力。'},
{q:'「臣所以去親戚而事君者」中「親戚」的古義是？',o:['泛指親屬','父母兄弟等至親','朋友','鄰居'],a:1,t:'字詞',c:'廉頗藺相如列傳',e:'「親戚」古義指父母兄弟等至親，與今日泛指親屬不同，屬古今異義。'},
{q:'藺相如處處避讓廉頗的原因是？',o:['畏懼廉頗的權勢','以先國家之急而後私讎','身體不適','不想爭權奪利'],a:1,t:'內容理解',c:'廉頗藺相如列傳',e:'藺相如明言「吾所以為此者，以先國家之急而後私讎也」，把國家安危放在私人恩怨之前。'},
{q:'「肉袒負荊」中「負」的意思是？',o:['背負','辜負','失敗','依靠'],a:0,t:'字詞',c:'廉頗藺相如列傳',e:'「負」解作背負。「肉袒負荊」指脫去上衣、背著荊條，表示認罪願受鞭打。'},
{q:'本文「完璧歸趙」詳寫、「澠池之會」略寫，屬於甚麼手法？',o:['詳略得宜','倒敘','插敘','對比'],a:0,t:'寫作手法',c:'廉頗藺相如列傳',e:'司馬遷詳寫完璧歸趙以突出藺相如的智勇，澠池之會則以簡筆帶過，使敘事節奏富變化，避免流水帳。'},

/* 出師表 */
{q:'「此誠危急存亡之秋也」中「秋」的意思是？',o:['秋天','時期、時刻','收成','憂愁'],a:1,t:'字詞',c:'出師表',e:'「秋」在此解作時期、時刻，指關鍵緊要的關頭。「危急存亡之秋」即危急存亡的時刻。'},
{q:'「不宜妄自菲薄，引喻失義」中「菲薄」的意思是？',o:['輕薄','看輕自己','節儉','卑微'],a:1,t:'字詞',c:'出師表',e:'「菲薄」即看輕、輕視，「妄自菲薄」指過分看輕自己，是諸葛亮勸諫後主之語。'},
{q:'「親賢臣，遠小人，此先漢所以興隆也」用了甚麼手法？',o:['對比','比喻','排比','誇張'],a:0,t:'寫作手法',c:'出師表',e:'此句以「親賢臣，遠小人」與「親小人，遠賢臣」正反對比，並舉兩漢興亡為證，屬對比論證兼舉例論證。'},
{q:'「臣本布衣」中「布衣」的修辭手法是？',o:['比喻','借代','誇張','用典'],a:1,t:'修辭',c:'出師表',e:'「布衣」以平民所穿的衣服借代平民，是借代手法，同時流露諸葛亮自謙之意。'},
{q:'「三顧臣於草廬之中」中「三顧」指？',o:['三次責備','三次拜訪','三次回顧','三次商議'],a:1,t:'字詞',c:'出師表',e:'「顧」解作拜訪，「三顧」即三次到草廬拜訪，指劉備三顧茅廬的知遇之恩。'},
{q:'諸葛亮在表中反覆提及「先帝」，主要作用是？',o:['單純懷念故人','借先帝之名勸勉後主、表明忠誠','炫耀自己的功績','責備後主無能'],a:1,t:'寫作手法',c:'出師表',e:'反覆提及先帝，既借先帝的知遇之恩表明自己的忠誠，又以先帝遺德勸勉後主，情理兼備，增強說服力。'},

/* 師說 */
{q:'「師者，所以傳道、受業、解惑也」中「受」通假為？',o:['授','收','承受','接受'],a:0,t:'字詞',c:'師說',e:'「受」通「授」，解作傳授。「傳道、受業、解惑」即老師的三大職責。'},
{q:'「道之所存，師之所存也」說明擇師的標準是？',o:['年齡長幼','地位高低','道的有無','官職大小'],a:2,t:'內容理解',c:'師說',e:'韓愈認為「無貴無賤，無長無少，道之所存，師之所存也」，擇師的唯一標準是「道」。'},
{q:'「位卑則足羞，官盛則近諛」用了甚麼修辭手法？',o:['對偶','比喻','誇張','反問'],a:0,t:'修辭',c:'師說',e:'「位卑」對「官盛」，「足羞」對「近諛」，句式工整對舉，揭露世人以地位取師的功利心態。'},
{q:'「是故弟子不必不如師」中「不必」的意思是？',o:['不需要','不一定','必然不','必須不'],a:1,t:'字詞',c:'師說',e:'「不必」古義為「不一定」，與今日「不需要」不同。全句謂弟子不一定不如老師。'},
{q:'韓愈寫作《師說》的主要目的是？',o:['讚美老師的偉大','批評當時恥學於師的風氣','介紹教學方法','記述自己的老師'],a:1,t:'內容理解',c:'師說',e:'韓愈針對唐代士大夫「恥學於師」的風氣而作，倡導尊師重道，並提出新的師生觀。'},
{q:'「聞道有先後，術業有專攻」說明甚麼？',o:['老師一定比學生強','師生關係是相對的，各有所長','術業無高低之分','道比術更重要'],a:1,t:'內容理解',c:'師說',e:'此句說明聞道有先後之別，學問技藝各有專長，故弟子不必不如師，師不必賢於弟子，師生關係是相對的。'},

/* 始得西山宴遊記 */
{q:'「自余為僇人」中「僇人」指？',o:['殺人犯','受刑辱的罪人','僕人','旅客'],a:1,t:'字詞',c:'始得西山宴遊記',e:'「僇」通「戮」，「僇人」指受刑辱的罪人，是柳宗元被貶後的自稱。'},
{q:'「恆惴慄」中「惴慄」的意思是？',o:['恐懼不安','憤怒不平','疲累不堪','興奮難抑'],a:0,t:'字詞',c:'始得西山宴遊記',e:'「惴慄」解作恐懼不安，寫出柳宗元貶謫永州後終日惶恐的心境。'},
{q:'「然後知吾嚮之未始遊」中「嚮」的意思是？',o:['方向','從前','趨向','響應'],a:1,t:'字詞',c:'始得西山宴遊記',e:'「嚮」通「向」，解作從前。全句謂從前根本未曾真正遊覽過，真正的遊覽從遊西山才開始。'},
{q:'「凡數州之土壤，皆在衽席之下」用了甚麼手法表現西山之高？',o:['比喻','誇張','擬人','排比'],a:1,t:'修辭',c:'始得西山宴遊記',e:'此句以誇張手法極寫登西山後視野之高遠，數州土地盡在坐席之下，反襯西山之特出與心胸之開闊。'},
{q:'柳宗元遊西山後的心境是？',o:['更加憂鬱苦悶','超脫物我、精神解脫','強烈思念家鄉','憤世嫉俗'],a:1,t:'內容理解',c:'始得西山宴遊記',e:'柳宗元登西山後「心凝形釋，與萬化冥合」，達到物我兩忘的境界，從貶謫的憂懼中獲得精神解脫。'},
{q:'「箕踞而遨」中「箕踞」的意思是？',o:['像簸箕一樣張開兩腿而坐','蹲下身子','快步行走','攀爬而上'],a:0,t:'字詞',c:'始得西山宴遊記',e:'「箕踞」指像簸箕一樣張開兩腿而坐，是不拘禮節的坐姿，寫出柳宗元登高後的自在灑脫。'},

/* 岳陽樓記 */
{q:'「滕子京謫守巴陵郡」中「謫」的意思是？',o:['責備','貶官','調升','辭官'],a:1,t:'字詞',c:'岳陽樓記',e:'「謫」解作貶官。「謫守巴陵郡」即被貶到巴陵郡做太守。'},
{q:'「銜遠山，吞長江」用了甚麼修辭手法？',o:['擬人兼誇張','對偶','排比','借代'],a:0,t:'修辭',c:'岳陽樓記',e:'「銜」「吞」二字將洞庭湖人格化，寫出湖水連接遠山、吞噬長江的雄偉氣勢，屬擬人兼誇張。'},
{q:'「不以物喜，不以己悲」用了甚麼修辭手法？',o:['互文','比喻','誇張','設問'],a:0,t:'修辭',c:'岳陽樓記',e:'此句為互文，上下句互相補充，意為「不因外物的好壞和自己的得失而或喜或悲」，須合併理解。'},
{q:'「先天下之憂而憂，後天下之樂而樂」表現了范仲淹？',o:['追求個人享樂','憂國憂民、以天下為己任','消極避世','隨遇而安'],a:1,t:'內容理解',c:'岳陽樓記',e:'此句為全文主旨，抒發了范仲淹以天下為己任、先憂後樂的宏大襟懷。'},
{q:'「至若春和景明」中「景」的意思是？',o:['景色','日光','影子','情況'],a:1,t:'字詞',c:'岳陽樓記',e:'「景」在此解作日光。「春和景明」即春風和煦、陽光明媚。'},
{q:'本文「霪雨霏霏」與「春和景明」兩段的主要作用是？',o:['單純記錄天氣變化','以景生情，形成悲喜對比，為議論鋪墊','記錄當地氣候','批評時政'],a:1,t:'寫作手法',c:'岳陽樓記',e:'兩段一悲一喜，寫出遷客騷人因景而生的兩種心情，形成對比，為後文議論古仁人的「不以物喜，不以己悲」作鋪墊。'},

/* 六國論 */
{q:'《六國論》的中心論點是？',o:['六國兵力不足','六國破滅，弊在賂秦','秦國國力強大','六國不善作戰'],a:1,t:'內容理解',c:'六國論',e:'文章開篇即提出「六國破滅，非兵不利，戰不善，弊在賂秦」，這是全文的中心論點。'},
{q:'「以地事秦，猶抱薪救火」用了甚麼論證手法？',o:['比喻論證','舉例論證','引用論證','對比論證'],a:0,t:'寫作手法',c:'六國論',e:'以「抱薪救火」比喻「以地事秦」的荒謬，生動說明賄賂秦國只會加速滅亡，使抽象道理具體化，增強說服力。'},
{q:'「思厥先祖父」中「祖父」的古義是？',o:['爺爺','祖輩與父輩','泛指祖先','家族'],a:1,t:'字詞',c:'六國論',e:'「祖父」古義指祖輩與父輩，與今日專指爺爺不同，屬古今異義。'},
{q:'「暴霜露，斬荊棘」中「暴」的意思是？',o:['暴露、冒著','殘暴','突然','曬'],a:0,t:'字詞',c:'六國論',e:'「暴」通「曝」，解作冒著。「暴霜露」即冒著風霜雨露，寫先人創業之艱。'},
{q:'蘇洵寫作《六國論》的真正用意是？',o:['純粹檢討歷史','借古諷今，警告北宋勿賂敵','讚美六國的堅守','批評秦國的殘暴'],a:1,t:'內容理解',c:'六國論',e:'蘇洵借六國賂秦而亡的史實，諷刺北宋以歲幣求和的政策，警告統治者勿重蹈覆轍。'},
{q:'「下而從六國破亡之故事」中「故事」的意思是？',o:['故事傳說','舊事、前例','情節','計謀'],a:1,t:'字詞',c:'六國論',e:'「故事」古義指舊事、前例，與今日「故事」不同。此句謂重蹈六國滅亡的覆轍。'},

/* 山居秋暝 */
{q:'「空山新雨後，天氣晚來秋」營造了甚麼氛圍？',o:['熱鬧喧囂','清幽空靈','悲涼蕭瑟','緊張壓抑'],a:1,t:'內容理解',c:'山居秋暝',e:'首聯以「空山」「新雨」點出雨後山林的清新空寂，營造清幽空靈的氛圍，其中「空」字為全詩詩眼。'},
{q:'「明月松間照，清泉石上流」用了甚麼手法？',o:['動靜結合（兼對偶）','誇張','擬人','借代'],a:0,t:'寫作手法',c:'山居秋暝',e:'此聯既是工整對偶，又是動靜結合：月光灑落為靜景，泉水流淌為動景，動靜相生，富於畫意。'},
{q:'「竹喧歸浣女，蓮動下漁舟」中「喧」與「動」的作用是？',o:['以動襯靜','渲染熱鬧氣氛','表達悲傷之情','單純描寫聲音'],a:0,t:'寫作手法',c:'山居秋暝',e:'以竹林的喧鬧與蓮葉的晃動，反襯山居環境的幽靜，同時寫出田園生活的純樸之樂。'},
{q:'「隨意春芳歇，王孫自可留」表達了作者？',o:['強烈思念家鄉','留戀山中、歸隱之志','感嘆時光易逝','惋惜春天離去'],a:1,t:'內容理解',c:'山居秋暝',e:'尾聯反用《楚辭》「王孫兮歸來，山中兮不可久留」之意，表達留戀山林、決意歸隱的心志。'},
{q:'本詩的詩眼可說是哪個字？',o:['空','秋','明','留'],a:0,t:'內容理解',c:'山居秋暝',e:'「空」字統攝全詩，既寫山林的空寂清幽，也暗含詩人空明澄澈的心境，為全詩詩眼。'},
{q:'王維此詩體現了甚麼風格？',o:['豪放飄逸','田園山水、詩中有畫','邊塞雄渾','諷喻現實'],a:1,t:'內容理解',c:'山居秋暝',e:'王維為山水田園詩派代表，此詩寫雨後山居秋景，詩中有畫，畫中有詩，意境清幽。'},

/* 月下獨酌 */
{q:'「舉杯邀明月，對影成三人」中「三人」指？',o:['李白、明月、影子','李白與兩位朋友','三位詩人','月亮與兩個影子'],a:0,t:'內容理解',c:'月下獨酌',e:'「三人」指詩人自己、明月與影子。此句以奇特想像化孤獨為熱鬧，展現李白的浪漫曠達。'},
{q:'「影徒隨我身」中「徒」的意思是？',o:['徒弟','只是、白白地','徒步','徒然無功'],a:1,t:'字詞',c:'月下獨酌',e:'「徒」解作只是、白白地。全句謂影子也只是白白地跟隨我的身體，寫出伴侶的無情。'},
{q:'「相期邈雲漢」中「雲漢」指？',o:['雲霧','銀河','漢朝','天空'],a:1,t:'字詞',c:'月下獨酌',e:'「雲漢」指銀河。詩人相約在遙遠的銀河相見，將孤獨昇華為永恆的精神寄託。'},
{q:'本詩主要抒發了作者怎樣的情感？',o:['歡樂愉悅','孤獨與超脫','愛國情懷','閒適自得'],a:1,t:'內容理解',c:'月下獨酌',e:'全詩由孤獨起筆，經邀月對影的奇想，最終相期雲漢，抒發孤獨中的曠達與超脫。'},
{q:'「我歌月徘徊，我舞影零亂」用了甚麼修辭手法？',o:['擬人','誇張','借代','設問'],a:0,t:'修辭',c:'月下獨酌',e:'「月徘徊」賦予月亮以人的情態，彷彿月亮隨詩人歌唱而徘徊不去，屬擬人手法。'},

/* =========================================================

   ========================================================= */
const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('wm_'+k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('wm_'+k, JSON.stringify(v)); }catch(e){} }
};
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const $ = s => document.querySelector(s);

/* 題目加 ID */
QUESTIONS.forEach((q,i)=>{ q.id = 'q'+i; });

/* =========================================================

   ========================================================= */
const state = {
  view:'read',
  chapter:0,
  pFilter:'all',
  pPool:[],
  pIdx:0,
  pAnswered:false
};

/* =========================================================
   視圖切換
   ========================================================= */
function switchView(v){
  state.view = v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  $('#view-'+v).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
  if(v==='practice') renderPractice();
  if(v==='notes') renderNotes();
  if(v==='stats') renderStats();
}

/* =========================================================
   精讀
   ========================================================= */
function countSentences(c){
  return c.sections.reduce((a,s)=>a+s.sentences.length,0);
}

function renderSidebar(){
  const el = $('#sidebar');
  el.innerHTML = '<div class="sb-title">十六篇指定篇章</div>' +
    CHAPTERS.map((c,i)=>`
      <div class="chap-item ${i===state.chapter?'on':''}" onclick="selectChapter(${i})">
        <div class="ci-num">${c.num}</div>
        <div class="ci-body">
          <div class="ci-title">${esc(c.title)}</div>
          <div class="ci-sub">${esc(c.author)} · ${esc(c.genre)}</div>
        </div>
      </div>`).join('');
}

function selectChapter(i){
  state.chapter = i;
  renderSidebar();
  renderReader();
  const c = $('#readerContent');
  if(c) c.scrollIntoView({behavior:'smooth',block:'start'});
  if(window.innerWidth<=860) window.scrollTo({top:0,behavior:'smooth'});
}

function markWords(text, words){
  if(!words || !words.length) return esc(text);
  const occupied = new Array(text.length).fill(false);
  const marks = [];
  const sorted = [...words].sort((a,b)=>b.w.length-a.w.length);
  sorted.forEach(item=>{
    if(!item.w) return;
    let idx = text.indexOf(item.w);
    while(idx !== -1){
      let ok = true;
      for(let k=idx;k<idx+item.w.length;k++){ if(occupied[k]){ ok=false; break; } }
      if(ok){
        for(let k=idx;k<idx+item.w.length;k++) occupied[k]=true;
        marks.push({s:idx,e:idx+item.w.length,item});
        break;
      }
      idx = text.indexOf(item.w, idx+1);
    }
  });
  marks.sort((a,b)=>a.s-b.s);
  let html='', pos=0;
  marks.forEach(m=>{
    if(m.s < pos) return;
    html += esc(text.slice(pos, m.s));
    html += `<span class="w" data-d="${esc(m.item.d)}" data-w="${esc(m.item.w)}">${esc(text.slice(m.s,m.e))}</span>`;
    pos = m.e;
  });
  html += esc(text.slice(pos));
  return html;
}

function renderReader(){
  const c = CHAPTERS[state.chapter];
  const readMap = LS.get('read', {});
  const readArr = readMap[c.id] || [];

  let html = `
  <div class="ch-head">
    <h2 class="kai">${esc(c.title)}</h2>
    <div class="ch-meta">
      <span>${esc(c.author)}</span>
      <span>${esc(c.era)}</span>
      <span>${esc(c.genre)}</span>
      <span>${esc(c.theme)}</span>
      <span>共 ${countSentences(c)} 句</span>
    </div>
    <div class="ch-intro">${esc(c.intro)}</div>
  </div>`;

  let gi = 0;
  c.sections.forEach(sec=>{
    html += `<div class="sec-name">${esc(sec.name)}</div>`;
    sec.sentences.forEach(s=>{
      const key = c.id+'-'+gi;
      const isRead = readArr.includes(key);
      const tags = [];
      if(s.rhet && s.rhet.length) s.rhet.forEach(r=>tags.push(`<span class="tag tag-rhet">修辭 · ${esc(r.t)}</span>`));
      if(s.tech) tags.push(`<span class="tag tag-tech">手法 · ${esc(s.tech.split('——')[0].split('＋')[0].split('—')[0].trim())}</span>`);
      if(s.point) tags.push(`<span class="tag tag-point">考點</span>`);

      let detail = '';
      if(s.rhet && s.rhet.length){
        s.rhet.forEach(r=>{
          detail += `<div class="d-row"><div class="d-key">修辭效果</div><div class="d-val"><b>${esc(r.t)}</b>｜「${esc(r.p)}」<br>${esc(r.e)}</div></div>`;
        });
      }
      if(s.words && s.words.length){
        detail += `<div class="d-row"><div class="d-key">字詞注釋</div><div class="d-val">${
          s.words.map(w=>`<span class="word-chip"><i>${esc(w.w)}</i>${esc(w.d)}</span>`).join('')
        }</div></div>`;
      }
      if(s.tech){
        detail += `<div class="d-row"><div class="d-key">寫作手法</div><div class="d-val">${esc(s.tech)}</div></div>`;
      }
      if(s.point){
        detail += `<div class="d-row"><div class="d-key">考點提示</div><div class="d-val">${esc(s.point)}</div></div>`;
      }

      html += `
      <div class="sentence ${isRead?'':'unread'}" data-key="${key}" onclick="toggleSentence(this, '${key}')">
        <div class="s-text">${markWords(s.text, s.words)}</div>
        <div class="s-trans"><b style="color:#2E6B62;">語譯：</b>${esc(s.trans)}</div>
        <div class="s-tags">${tags.join('')}</div>
        <div class="s-detail">${detail}</div>
      </div>`;
      gi++;
    });
  });

  $('#readerContent').innerHTML = html;
  updateWordPop();
}

function toggleSentence(el, key){
  el.classList.toggle('open');
  const c = CHAPTERS[state.chapter];
  const readMap = LS.get('read', {});
  if(!readMap[c.id]) readMap[c.id] = [];
  if(el.classList.contains('open')){
    if(!readMap[c.id].includes(key)) readMap[c.id].push(key);
  }
  LS.set('read', readMap);
}

/* 詞語氣泡 */
function updateWordPop(){
  const pop = $('#wpop');
  document.querySelectorAll('.w').forEach(w=>{
    w.addEventListener('click', e=>{
      e.stopPropagation();
      pop.innerHTML = `<b>${esc(w.dataset.w)}</b>${esc(w.dataset.d)}`;
      pop.style.display='block';
      const r = w.getBoundingClientRect();
      let left = r.left + r.width/2 - 125;
      left = Math.max(10, Math.min(left, window.innerWidth-260));
      let top = r.bottom + 8;
      if(top + 80 > window.innerHeight) top = r.top - 70;
      pop.style.left = left+'px';
      pop.style.top = top+'px';
    });
  });
}
document.addEventListener('click', e=>{
  if(!e.target.classList.contains('w')) $('#wpop').style.display='none';
});
window.addEventListener('scroll', ()=>{ $('#wpop').style.display='none'; }, true);

/* =========================================================
   練習
   ========================================================= */
function buildPool(){
  let pool = QUESTIONS.slice();
  if(state.pFilter !== 'all'){
    pool = pool.filter(q => q.t === state.pFilter || q.c === state.pFilter);
  }
  return pool;
}

function renderPractice(){
  const types = ['all','字詞','修辭','寫作手法','內容理解','跨篇比較'];
  $('#pFilters').innerHTML = types.map(t=>
    `<button class="chip ${state.pFilter===t?'on':''}" onclick="setPFilter('${t}')">${t==='all'?'全部題型':t}</button>`
  ).join('');

  if(state.pPool.length === 0 || state.pIdx >= state.pPool.length){
    state.pPool = buildPool();
    state.pIdx = 0;
    state.pAnswered = false;
  }
  renderQuestion();
}

function setPFilter(f){
  state.pFilter = f;
  state.pPool = buildPool();
  state.pIdx = 0;
  state.pAnswered = false;
  renderPractice();
}

function renderQuestion(){
  const pool = state.pPool;
  const q = pool[state.pIdx];
  const stats = LS.get('stats', {});
  const total = Object.keys(stats).length;
  const correct = Object.values(stats).filter(v=>v===1).length;

  if(!q){
    $('#pBody').innerHTML = '<div class="empty">此分類暫無題目</div>';
    return;
  }

  const typeCls = q.t==='修辭'?'tag-rhet':(q.t==='寫作手法'?'tag-tech':'tag-point');

  $('#pBody').innerHTML = `
  <div class="p-card">
    <div class="p-top">
      <span class="tag ${typeCls}">${esc(q.t)}</span>
      <span class="tag tag-tech">${esc(q.c)}</span>
      <span class="p-prog">第 ${state.pIdx+1} / ${pool.length} 題</span>
    </div>
    <div class="p-q">${esc(q.q)}</div>
    <div id="opts">
      ${q.o.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answerQ(${i})">
        <span class="opt-key">${'ABCD'[i]}</span><span>${esc(o)}</span>
      </button>`).join('')}
    </div>
    <div class="p-exp" id="pExp"><b>解析：</b>${esc(q.e)}</div>
    <div class="p-foot">
      <button class="btn btn-primary" id="btnNext" style="display:none" onclick="nextQ()">
        ${state.pIdx+1>=pool.length?'重新開始':'下一題 →'}
      </button>
      <button class="btn btn-ghost" onclick="resetStats()">清除練習記錄</button>
      <div class="p-score">已答 <b>${total}</b> 題 · 正確率 <b>${total?Math.round(correct/total*100):0}%</b></div>
    </div>
  </div>`;
  state.pAnswered = false;
}

function answerQ(i){
  if(state.pAnswered) return;
  state.pAnswered = true;
  const q = state.pPool[state.pIdx];
  const opts = document.querySelectorAll('#opts .opt');
  opts.forEach((el,idx)=>{
    el.classList.add('done');
    if(idx === q.a) el.classList.add('right');
    if(idx === i && i !== q.a) el.classList.add('wrong');
  });
  $('#pExp').classList.add('on');
  $('#btnNext').style.display = 'inline-block';

  const stats = LS.get('stats', {});
  stats[q.id] = (i === q.a) ? 1 : 0;
  LS.set('stats', stats);
}

function nextQ(){
  state.pIdx++;
  if(state.pIdx >= state.pPool.length){
    state.pIdx = 0;
    state.pPool = buildPool();
  }
  renderQuestion();
}

function resetStats(){
  if(confirm('確定清除所有練習記錄？')){
    LS.set('stats', {});
    renderQuestion();
  }
}

/* =========================================================
   筆記
   ========================================================= */
function renderNotes(){
  const notes = LS.get('notes', {});
  $('#notesBody').innerHTML = CHAPTERS.map(c=>`
    <div class="note-card">
      <h4><span class="ci-num">${c.num}</span>${esc(c.title)} <span>· ${esc(c.author)}</span></h4>
      <textarea placeholder="記下這篇的重點、答題框架、易錯字詞……" oninput="saveNote('${c.id}', this)">${esc(notes[c.id]||'')}</textarea>
      <div class="save-hint" id="hint-${c.id}">✓ 已儲存</div>
    </div>`).join('');
}

let noteTimer = null;
function saveNote(id, el){
  const notes = LS.get('notes', {});
  notes[id] = el.value;
  LS.set('notes', notes);
  const h = $('#hint-'+id);
  h.classList.add('on');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>h.classList.remove('on'), 1200);
}

/* =========================================================
   統計
   ========================================================= */
function renderStats(){
  const readMap = LS.get('read', {});
  const stats = LS.get('stats', {});

  const totalS = CHAPTERS.reduce((a,c)=>a+countSentences(c),0);
  let readN = 0;
  CHAPTERS.forEach(c=>{ readN += (readMap[c.id]||[]).length; });

  const answered = Object.keys(stats).length;
  const correct = Object.values(stats).filter(v=>v===1).length;
  const rate = answered ? Math.round(correct/answered*100) : 0;

  // 按題型統計
  const byType = {};
  QUESTIONS.forEach(q=>{
    if(!byType[q.t]) byType[q.t] = {n:0, c:0};
    if(stats[q.id] !== undefined){
      byType[q.t].n++;
      if(stats[q.id]===1) byType[q.t].c++;
    }
  });

  // 按篇章精讀進度
  const chapRows = CHAPTERS.map(c=>{
    const t = countSentences(c);
    const r = (readMap[c.id]||[]).length;
    return {name:c.title, t, r};
  });

  let html = `
  <div class="stat-grid">
    <div class="stat-box"><div class="num">${readN}<small> / ${totalS}</small></div><div class="lbl">已精讀句數</div></div>
    <div class="stat-box"><div class="num">${answered}</div><div class="lbl">累計答題</div></div>
    <div class="stat-box"><div class="num">${rate}<small>%</small></div><div class="lbl">整體正確率</div></div>
    <div class="stat-box"><div class="num">${Math.round(readN/totalS*100)}<small>%</small></div><div class="lbl">精讀完成度</div></div>
  </div>

  <div class="panel">
    <h3>各題型正確率</h3>
    ${Object.keys(byType).length ? Object.entries(byType).map(([k,v])=>{
      const p = v.n ? Math.round(v.c/v.n*100) : 0;
      return `<div class="bar-row">
        <div class="bar-lbl">${esc(k)}</div>
        <div class="bar-track"><div class="bar-fill ${p<60?'low':''}" style="width:${p}%"></div></div>
        <div class="bar-val">${p}% (${v.c}/${v.n})</div>
      </div>`;
    }).join('') : '<div class="empty">尚未作答任何題目</div>'}
  </div>

  <div class="panel">
    <h3>各篇精讀進度</h3>
    ${chapRows.map(r=>{
      const p = Math.round(r.r/r.t*100);
      return `<div class="bar-row">
        <div class="bar-lbl" style="width:130px;font-size:12px;">${esc(r.name)}</div>
        <div class="bar-track"><div class="bar-fill ${p<50?'low':''}" style="width:${p}%"></div></div>
        <div class="bar-val">${r.r}/${r.t}</div>
      </div>`;
    }).join('')}
  </div>`;

  $('#statsBody').innerHTML = html;
}

/* =========================================================
   初始化
   ========================================================= */
renderSidebar();
renderReader();
</script>
</body>
</html>
