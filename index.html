<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文脈 · DSE 中文十六篇 </title>
<style>
:root{--paper:#F8F4EC;--paper2:#FFFDF8;--ink:#1A1A1A;--ink2:#5A5040;--cinnabar:#C0392B;--jade:#7BA9A2;--gold:#C9A96E;--line:#E6DCCB;--shadow:0 2px 10px rgba(90,70,40,.06);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--paper);background-image:radial-gradient(circle at 20% 10%,rgba(201,169,110,.06) 0%,transparent 45%),radial-gradient(circle at 85% 80%,rgba(123,169,162,.05) 0%,transparent 40%);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;}
.kai{font-family:"Kaiti","KaiTi","STKaiti","DFKai-SB","Songti TC",serif;}
header{position:sticky;top:0;z-index:120;background:rgba(248,244,236,.94);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
.hd-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 20px;}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.logo-seal{width:36px;height:36px;border-radius:8px;background:var(--cinnabar);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Kaiti",serif;font-size:20px;font-weight:700;box-shadow:0 2px 6px rgba(192,57,43,.3);}
.logo-txt h1{font-size:17px;font-weight:700;letter-spacing:2px;line-height:1.2;}
.logo-txt p{font-size:10.5px;color:var(--ink2);letter-spacing:.5px;line-height:1.2;}
nav.tabs{margin-left:auto;display:flex;gap:3px;background:#EFE8DA;padding:4px;border-radius:10px;flex-wrap:wrap;}
nav.tabs button{border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink2);padding:7px 13px;border-radius:7px;transition:.2s;font-weight:500;}
nav.tabs button.on{background:#fff;color:var(--cinnabar);box-shadow:var(--shadow);font-weight:700;}
.view{display:none;}.view.on{display:block;}
.reader{display:flex;max-width:1320px;margin:0 auto;align-items:flex-start;}
.sidebar{width:250px;flex-shrink:0;padding:18px 12px 60px;position:sticky;top:65px;max-height:calc(100vh - 65px);overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:5px;}
.sidebar::-webkit-scrollbar-thumb{background:#DDD2BE;border-radius:4px;}
.sb-title{font-size:11px;letter-spacing:2px;color:var(--ink2);padding:0 8px 10px;font-weight:600;}
.chap-item{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:.16s;margin-bottom:2px;}
.chap-item:hover{background:#F1EADC;}
.chap-item.on{background:#fff;box-shadow:var(--shadow);}
.chap-item.on .ci-num{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar);}
.ci-num{flex-shrink:0;width:21px;height:21px;border-radius:5px;border:1px solid var(--line);background:#FBF7EF;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-weight:700;margin-top:2px;}
.ci-title{font-size:13.5px;font-weight:600;line-height:1.4;}
.ci-sub{font-size:11px;color:#998E7B;margin-top:1px;}
.content{flex:1;min-width:0;padding:22px 26px 120px;max-width:960px;}
.ch-head{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin-bottom:20px;position:relative;overflow:hidden;}
.ch-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--cinnabar),var(--gold));}
.ch-head h2{font-size:24px;letter-spacing:2px;margin-bottom:6px;}
.ch-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.ch-meta span{font-size:11.5px;padding:2px 10px;border-radius:20px;background:#F2EADC;color:#7A6A4E;border:1px solid #E6D9BF;}
.ch-intro{font-size:13.5px;color:var(--ink2);line-height:1.85;}
.sec-name{font-family:"Kaiti",serif;font-size:16px;color:var(--cinnabar);letter-spacing:2px;margin:26px 0 12px;padding-left:12px;border-left:3px solid var(--cinnabar);}
.sentence{background:var(--paper2);border:1px solid var(--line);border-radius:11px;padding:14px 18px 13px;margin-bottom:11px;cursor:pointer;transition:.18s;position:relative;}
.sentence:hover{border-color:#DBC99E;box-shadow:0 2px 12px rgba(160,130,70,.08);}
.sentence.open{border-color:var(--gold);box-shadow:0 3px 16px rgba(160,130,70,.11);}
.s-text{font-family:"Kaiti",serif;font-size:18.5px;line-height:2.05;color:#241F19;letter-spacing:.5px;}
.s-trans{font-size:13.5px;color:#3E6B63;line-height:1.8;margin-top:9px;padding:8px 12px;background:#F0F6F4;border-radius:7px;border-left:3px solid var(--jade);display:none;}
.sentence.open .s-trans{display:block;}
.s-tags{display:flex;flex-wrap:wrap;gap:0;margin-top:7px;}
.tag{display:inline-block;font-size:11px;padding:1.5px 9px;border-radius:20px;margin:3px 6px 0 0;line-height:1.6;}
.tag-rhet{background:#FDECEA;color:#B23A2C;border:1px solid #F2C8C2;}
.tag-tech{background:#EAF4F2;color:#2E6B62;border:1px solid #C5E0DC;}
.tag-point{background:#FBF4E6;color:#8A6A2F;border:1px solid #EAD9B5;}
.tag-emo{background:#F3EAF7;color:#6B4A8A;border:1px solid #DCC8E8;}
.tag-sym{background:#EAF0FB;color:#3A5A9E;border:1px solid #C8D6F0;}
.tag-deep{background:#FDF2E9;color:#A05A20;border:1px solid #F0D6BA;}
.s-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
.sentence.open .s-detail{display:block;}
.an-block{border-radius:9px;padding:12px 15px;margin-bottom:11px;font-size:13px;line-height:1.85;}
.an-block .an-title{font-size:11.5px;font-weight:700;letter-spacing:1.5px;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
.an-block .an-title::before{content:"";width:4px;height:13px;border-radius:2px;display:inline-block;}
.an-emo{background:#FAF6FC;border:1px solid #EEE2F5;}
.an-emo .an-title{color:#6B4A8A;}.an-emo .an-title::before{background:#7B4F9E;}
.an-sym{background:#F4F7FD;border:1px solid #E0E8F7;}
.an-sym .an-title{color:#3A5A9E;}.an-sym .an-title::before{background:#3A5A9E;}
.an-deep{background:#FDF8F2;border:1px solid #F3E4D2;}
.an-deep .an-title{color:#A05A20;}.an-deep .an-title::before{background:#D4782F;}
.an-rhet{background:#FEF6F5;border:1px solid #F8E0DC;}
.an-rhet .an-title{color:#B23A2C;}.an-rhet .an-title::before{background:#C0392B;}
.an-tech{background:#F3F9F8;border:1px solid #DCEDEA;}
.an-tech .an-title{color:#2E6B62;}.an-tech .an-title::before{background:#4E9E78;}
.an-point{background:#FEFAF0;border:1px solid #F5E9CF;}
.an-point .an-title{color:#8A6A2F;}.an-point .an-title::before{background:#C9A96E;}
.word-grid{display:flex;flex-direction:column;gap:8px;}
.word-item{background:#fff;border:1px solid #F0E6D2;border-radius:8px;padding:9px 13px;}
.word-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.word-head b{font-size:16px;color:var(--cinnabar);font-family:"Kaiti",serif;}
.word-head .py{font-size:11px;color:#A2967F;}
.word-head .pos{font-size:10.5px;padding:1px 7px;border-radius:4px;background:#F2EADC;color:#8A7A5C;}
.word-def{font-size:12.5px;color:var(--ink2);margin-top:4px;}
.word-deep{font-size:12px;color:#6B5E48;margin-top:5px;padding-top:5px;border-top:1px dotted #EEE2CC;line-height:1.75;}
.word-deep b{color:#A05A20;font-weight:600;}
.w{border-bottom:1.5px dashed var(--gold);color:#8A5A2B;cursor:help;transition:.15s;padding-bottom:1px;}
.w:hover{background:#FFF2D6;border-radius:3px;}
#wpop{position:fixed;z-index:300;max-width:270px;background:#26221C;color:#F5EFE3;font-size:12.5px;line-height:1.65;padding:10px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:none;pointer-events:none;}
#wpop b{color:#F0C36A;display:block;font-size:14px;margin-bottom:3px;font-family:"Kaiti",serif;}
#wpop .wp-deep{color:#C9C0B0;font-size:11.5px;margin-top:5px;padding-top:5px;border-top:1px solid #3A352E;}
.fw-wrap{max-width:920px;margin:0 auto;padding:24px 20px 120px;}
.fw-intro{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:20px;box-shadow:var(--shadow);}
.fw-intro h2{font-size:19px;letter-spacing:1px;margin-bottom:8px;color:var(--cinnabar);font-family:"Kaiti",serif;}
.fw-intro p{font-size:13.5px;color:var(--ink2);line-height:1.9;}
.fw-card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);}
.fw-card h3{font-size:16px;color:#2E7A45;margin-bottom:14px;display:flex;align-items:center;gap:9px;font-family:"Kaiti",serif;letter-spacing:1px;}
.fw-card h3 .fw-no{width:26px;height:26px;border-radius:7px;background:#2E7A45;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-weight:700;}
.fw-steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.fw-step{background:#F2FAF5;border:1px solid #C8E6D5;border-radius:8px;padding:7px 13px;font-size:12.5px;color:#2E7A45;font-weight:600;position:relative;}
.fw-step::after{content:"→";position:absolute;right:-16px;color:#A8C9B5;font-weight:400;}
.fw-step:last-child::after{display:none;}
.fw-formula{background:#FCFAF5;border:1px dashed #D8C9A8;border-radius:9px;padding:13px 16px;font-size:13px;color:#5A4A2A;line-height:1.9;margin-bottom:13px;}
.fw-formula b{color:var(--cinnabar);}
.fw-example{background:#F8FBF9;border-left:3px solid var(--jade);border-radius:0 9px 9px 0;padding:13px 17px;font-size:13px;color:#3A4A44;line-height:1.9;}
.fw-example .ex-label{font-size:11px;color:#4E9E78;font-weight:700;letter-spacing:1px;margin-bottom:5px;}
.fw-example .ex-text{font-family:"Kaiti",serif;font-size:14px;color:#2E5C4A;}
.notes-wrap,.stats-wrap{max-width:920px;margin:0 auto;padding:24px 20px 120px;}
.note-card{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow);}
.note-card h4{font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px;}
.note-card textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-family:inherit;font-size:13.5px;line-height:1.8;background:#FCFAF5;color:var(--ink);outline:none;}
.note-card textarea:focus{border-color:var(--gold);background:#fff;}
.save-hint{font-size:11px;color:#4E9E78;opacity:0;transition:.3s;margin-top:5px;}
.save-hint.on{opacity:1;}
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.panel h3{font-size:14.5px;margin-bottom:16px;letter-spacing:1px;color:#3A3227;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
.stat-box{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
.stat-box .num{font-size:28px;font-weight:700;color:var(--cinnabar);line-height:1.2;font-family:"Kaiti",serif;}
.stat-box .num small{font-size:14px;color:#B5AA96;font-weight:400;}
.stat-box .lbl{font-size:12px;color:var(--ink2);margin-top:3px;}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:13px;}
.bar-lbl{width:130px;flex-shrink:0;color:var(--ink2);font-size:12px;}
.bar-track{flex:1;height:9px;background:#EFE8DA;border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--jade),#4E9E78);transition:width .5s;}
.bar-fill.low{background:linear-gradient(90deg,#E5A79E,var(--cinnabar));}
.bar-val{width:60px;text-align:right;color:#8A7A5C;font-size:12px;flex-shrink:0;}
.empty{text-align:center;color:#B5AA96;font-size:13.5px;padding:40px 0;}
@media (max-width:900px){
  .hd-inner{padding:10px 12px;gap:8px;flex-wrap:wrap;}
  .logo-txt p{display:none;}
  nav.tabs button{padding:6px 10px;font-size:12px;}
  .reader{flex-direction:column;}
  .sidebar{width:100%;position:static;max-height:none;display:flex;gap:7px;overflow-x:auto;border-bottom:1px solid var(--line);padding:11px 12px;}
  .sidebar::-webkit-scrollbar{height:0;}
  .sb-title{display:none;}
  .chap-item{flex-shrink:0;background:var(--paper2);border:1px solid var(--line);padding:6px 12px;margin:0;}
  .chap-item .ci-num{display:none;}.ci-sub{display:none;}
  .ci-title{font-size:12.5px;white-space:nowrap;}
  .content{padding:16px 14px 100px;}
  .ch-head{padding:18px;}.ch-head h2{font-size:20px;}
  .s-text{font-size:17px;}.logo-txt h1{font-size:15px;}
}
  /* ===== 朗讀控制欄 ===== */
.tts-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#FFFDF8,#F8F4EC);border:1px solid var(--line);border-radius:12px;padding:11px 16px;margin-bottom:18px;box-shadow:var(--shadow);position:sticky;top:65px;z-index:55;}
.tts-left{display:flex;gap:8px;flex-wrap:wrap;}
.tts-right{display:flex;gap:10px;margin-left:auto;font-size:12.5px;color:var(--ink2);align-items:center;flex-wrap:wrap;}
.tts-btn{font-family:inherit;font-size:13px;font-weight:600;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;background:var(--cinnabar);color:#fff;box-shadow:0 2px 6px rgba(192,57,43,.25);transition:.16s;display:inline-flex;align-items:center;gap:5px;}
.tts-btn:hover{background:#A93226;transform:translateY(-1px);}
.tts-btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none;}
.tts-btn.ghost:hover{border-color:var(--gold);color:var(--ink);background:#FFFBF0;}
.tts-select{font-family:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer;outline:none;margin-left:4px;}
.tts-select:focus{border-color:var(--gold);}
.tts-progress{font-size:12px;color:var(--cinnabar);font-weight:600;margin-left:auto;white-space:nowrap;}
.sentence.tts-reading{background:#FFF8E7 !important;border-color:var(--gold) !important;box-shadow:0 3px 16px rgba(201,169,110,.25) !important;transform:scale(1.008);}
.sentence.tts-reading .s-text{color:#8A5A2B;font-weight:700;}
@media(max-width:900px){
  .tts-bar{position:static;padding:10px 12px;}
  .tts-right{margin-left:0;width:100%;}
  .tts-progress{margin-left:0;width:100%;text-align:right;}
}
</style>
</head>
<body>

<header>
  <div class="hd-inner">
    <div class="logo" onclick="switchView('read')">
      <div class="logo-seal">文</div>
      <div class="logo-txt"><h1>Mushchi </h1><p>DSE 中文十六篇 </p></div>
    </div>
    <nav class="tabs">
      <button data-v="read" class="on" onclick="switchView('read')">精讀</button>
      <button data-v="framework" onclick="switchView('framework')">作答框架</button>
      <button data-v="notes" onclick="switchView('notes')">筆記</button>
      <button data-v="stats" onclick="switchView('stats')">統計</button>
    </nav>
  </div>
</header>

<section id="view-read" class="view on">
  <div class="reader">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="readerContent"></main>
  </div>
</section>

<section id="view-framework" class="view">
  <div class="fw-wrap" id="fwBody"></div>
</section>

<section id="view-notes" class="view">
  <div class="notes-wrap">
    <div class="panel" style="margin-bottom:18px;">
      <h3>📝 我的筆記本</h3>
      <p style="font-size:13px;color:var(--ink2);line-height:1.8;">為每篇範文記下你的理解、答題框架與易錯點。內容自動儲存於本機瀏覽器，離線亦可溫習。</p>
    </div>
    <div id="notesBody"></div>
  </div>
</section>

<section id="view-stats" class="view">
  <div class="stats-wrap" id="statsBody"></div>
</section>

<div id="wpop"></div>

<script>
/* =========================================================
   作答框架
   ========================================================= */
const FRAMEWORKS = [
{title:'修辭手法題',no:1,steps:['手法名稱','引文具體內容','效果分析'],
 formula:'【修辭手法】＋【引文內容（如何運用）】＋【效果分析（對表達的作用）】',
 example:'作者以<b>比喻</b>手法，將「以地事秦」比作「抱薪救火」，生動形象地說明了賄賂秦國只會加速自身滅亡的道理，使抽象的政治論述變得具體可感，增強了說服力。',
 note:'答題時切忌只寫手法名稱，必須引原文並分析效果；效果分析要扣緊「形象生動」「增強說服力」「突出情感」等方向。'},
{title:'寫作手法分析題',no:2,steps:['手法判斷','文本證據','效果闡述','扣題回應'],
 formula:'【手法判斷】→【文本證據（引文）】→【效果闡述（對人物／主旨／結構的作用）】→【扣題回應】',
 example:'司馬遷運用<b>詳略得宜</b>的敘事手法。「完璧歸趙」一事詳加鋪陳，突出藺相如的機智勇敢；而「澠池之會」則以簡筆帶過。此舉使人物形象更鮮明，敘事節奏富變化，避免流水帳式記載，亦緊扣「智勇忠義」的主題。',
 note:'不同手法有不同分析方向：敘事手法重結構與人物塑造，描寫手法重畫面與氛圍，抒情手法重情感傳達。'},
{title:'比較題（跨篇章）',no:3,steps:['確立比較點','各自舉證','分析異同','評價效果'],
 formula:'【確立比較點】→【甲篇舉證】→【乙篇舉證】→【分析異同】→【評價優劣／效果】',
 example:'就<b>抒情手法</b>而言，《岳陽樓記》借景抒情，以洞庭湖陰晴變化寄託憂樂之情；《始得西山宴遊記》則以山水之遊寄寓貶謫後的超脫心境。兩者均借外物抒懷，但范仲淹側重家國情懷，柳宗元則傾向個人精神解脫，前者胸襟更宏大，後者則更見個人心境之細膩。',
 note:'比較題必須先明確「比較點」（如手法、情感、結構），再分述兩篇，最後作綜合評價，切忌只描述而不比較。'},
{title:'象徵意義題',no:4,steps:['指出象徵物','本體與象徵義','文本依據','深層情感'],
 formula:'【象徵物】→【所象徵的本體／意義】→【文本依據（引文）】→【深層情感或主旨連結】',
 example:'「燈火闌珊處」的<b>「那人」</b>，象徵詞人不趨流俗、自甘寂寞的高潔人格。全詞極寫元宵燈火的熱鬧繁華，最後卻歸於冷清之處，正是以熱鬧反襯「那人」的孤高，寄託辛棄疾在政治失意中堅守理想、不與世俗同流的情懷。',
 note:'象徵題的關鍵是「由物及人、由表及裡」，須結合寫作背景與全篇主旨作答。'},

    {w:'空',d:'空寂、空明',py:'kōng',pos:'形容詞',deep:'「空」為全詩詩眼，一字統攝全篇，亦為王維全部山水詩之核心哲學。此「空」非空無，而是佛家「空即是色，色即是空」之「空」——非無萬物，而是萬物皆因緣和合、無自性。一「空」字，上承大乘佛教「緣起性空」之義，下啟王維「詩中有畫、畫中有禪」之境。此「空」中有萬象：雨後之「新」、月照之「明」、泉流之「清」、竹喧之「動」、蓮動之「靜」——皆由此「空」中生出。禪家云：「真空生妙有」，王維以一字盡之。'},
    {w:'新',d:'剛下過的',py:'xīn',pos:'形容詞',deep:'「新」字有時間與質地雙重妙用。時間上寫雨之「剛下」，寫出雨的當下性；質地上寫雨後萬物之「清新」，寫出雨的洗滌性。一「新」字令空山不覺蕭索，反生潔淨明亮之感，為下文「明月」「清泉」鋪墊潔淨底色。此字與王維《送元二使安西》「渭城朝雨浥輕塵」之「浥」異曲同工——皆以雨洗塵，以雨淨心。'},
    {w:'晚來',d:'傍晚時分',py:'wǎn lái',pos:'名詞',deep:'「晚來」點明時間，卻不止於記時。「晚」字自帶暮色蒼茫之意，與「秋」字相疊，一重暮、一重秋，雙重遲暮感籠罩全詩。然王維之「晚」非衰颯，而是禪家「日暮蒼山遠」之澄明——暮色之中，反見清朗。此為王維煉字之妙——以遲暮之景寫澄明之心，以衰落之時寫永恆之境。'}
   ],
   rhet:[],tech:'以景起筆——點明時地，營造清幽空靈的氛圍，為全詩定下「空明」之基調',
   point:'「空」為全詩詩眼，常考其統攝作用；「新」「晚」二字的煉字效果亦為高頻考點；「空」字的佛學意涵為5**以上之鑑賞要點',
   emotion:'恬淡閒適的歸隱之情。王維以「空山」「新雨」營造清幽氛圍，語氣恬淡，流露歸隱之志。此非一般之恬淡，而是禪家「無住生心」之寂靜——心無所住，故能見萬物之澄明。',
   symbol:'「空山」象徵遠離塵囂的清淨之地，亦象徵詩人空明澄澈之禪心；「新雨」象徵洗滌心靈的清新，亦象徵禪家之「洗心」。「空山」與「新雨」疊加，構成王維山水詩之基本語境——以自然之清淨，寫心靈之清淨。',
   deep:'此聯以「空山」「新雨」「晚來秋」點明時地。一「空」字統攝全篇，既寫山林之空寂，也暗含詩人空明澄澈的心境；一「新」字洗去秋之衰颯，反見潔淨；一「晚」字與「秋」相疊，遲暮之中見清朗。三字煉盡，為全詩奠定清幽空靈的基調。此聯之妙，在於以「空」為體，以「新」「晚」為用——「空」是體，「新」「晚」是用；「空」是本體論，「新」「晚」是現象學。王維以佛家本體論入詩，而不著痕跡，此為盛唐詩之極詣。'},
  {text:'明月松間照，清泉石上流。',
   trans:'明月的清輝灑落在松林之間，清澈的泉水在山石上流淌。',
   words:[
    {w:'明',d:'明亮',py:'míng',pos:'形容詞',deep:'「明」字寫月光之亮。一「明」字有澄澈之意，與「空」字相應——「空」是體，「明」是用；「空」是境，「明」是光。此「明」非一般之明，而是禪家「明心見性」之「明」——月照松間，即心照萬物。王維以「明」字寫月，實寫本心之明。'},
    {w:'照',d:'照耀、灑落',py:'zhào',pos:'動詞',deep:'「照」字寫月光之灑落，為靜景。月光本無形，一「照」字使其有形有質，如清輝鋪地。與下句「流」字對舉，一靜一動，一上一下，一光一水，構成完整的時空畫面。「照」字有主動意——月光主動照臨，非被動承受，見自然之有情。'},
    {w:'清',d:'清澈',py:'qīng',pos:'形容詞',deep:'「清」字寫泉水之澄澈。一「清」字有潔淨之意，與「明」字對舉——「明」寫月光之亮，「清」寫泉水之澄。「明」「清」並置，寫出雨後山水之澄澈。此「清」字與禪家「清淨心」相應——泉清如心清，水淨如心淨。'},
    {w:'流',d:'流淌',py:'liú',pos:'動詞',deep:'「流」字寫泉水之流淌，為動景。一「流」字使畫面流動起來，泉聲彷彿可聞。此聯動靜相生，以「照」之靜襯「流」之動，以「流」之動破「照」之靜，動靜不二，正是王維山水詩之極詣。「流」字有時間意——泉水不斷流淌，即時間不斷流逝，而明月永恆靜照，動靜之間見永恆與無常之辯證。'}
   ],
   rhet:[{t:'對偶',p:'明月松間照／清泉石上流',e:'名詞對名詞（明月／清泉、松間／石上）、動詞對動詞（照／流），一一相對，畫面工整，音韻和諧，是千古名句。此聯不僅對仗精工，更在對仗中見動靜、見時空、見禪意，為唐詩對偶之極品。'}],
   tech:'動靜結合——月光為靜景，泉流為動景，動靜相生，此為王維山水詩之核心手法',
   point:'千古名句，「詩中有畫」的典型；「照」「流」二字的動靜對舉為高頻考點；「明」「清」二字與禪家「明心見性」「清淨心」的關聯為5**以上之鑑賞要點',
   emotion:'清幽恬靜的審美之情。王維以「明月」「清泉」寫雨後山景，語氣恬淡，流露對自然的喜愛。此情非一般之喜愛，而是禪家「物我兩忘」之寂靜——主客雙泯，物我合一。',
   symbol:'「明月」「清泉」象徵高潔的品格與清淨的心境，亦象徵詩人歸隱的理想境界。「明月」照松間，象徵本心照萬物；「清泉」流石上，象徵自性任運而流。此聯與《六祖壇經》「菩提本無樹，明鏡亦非臺」異曲同工——皆寫本心之清淨無染。',
   deep:'此聯為千古名句，以工整對偶寫出明月照松、清泉流石的畫面。一「照」字寫月光之靜，一「流」字寫泉水之動，動靜相生，詩中有畫。王維以此營造清幽的意境，寄託其歸隱之志，體現山水田園詩的最高成就。此聯之妙，在於「以動寫靜」與「以靜寫動」之雙重手法——月光靜照而萬物皆動，泉水動流而心境愈靜。此即王維「動靜不二」之禪學。蘇軾評王維「詩中有畫，畫中有詩」，此聯即「詩中有畫」之極致——不唯「畫」，更有「禪」。'},
  {text:'竹喧歸浣女，蓮動下漁舟。',
   trans:'竹林裡傳來喧鬧聲，那是洗衣的姑娘回來了；蓮葉晃動，是漁船順流而下。',
   words:[
    {w:'喧',d:'喧鬧',py:'xuān',pos:'動詞',deep:'「喧」字以有聲寫無聲。竹林本靜，一「喧」字寫浣女歸來之歡笑，反襯山居之幽靜。此即「以動襯靜」之妙——非以靜寫靜，而以聲寫靜，愈見其靜。王維之「喧」非世俗之喧，而是田園之歡——歡笑之中見純樸，見自然之樂。此「喧」字與陶淵明「雞鳴桑樹顛」之「鳴」異曲同工，皆以聲寫田園之樂。'},
    {w:'歸',d:'歸來',py:'guī',pos:'動詞',deep:'「歸」字寫浣女歸來。一「歸」字有歸宿之意——浣女歸家，即萬物各歸其位。此「歸」字與「空」字相應——「空」是無所住，「歸」是有所歸；「空」是體，「歸」是用。王維以「歸」字寫田園之樂，見自然之和諧。'},
    {w:'動',d:'晃動',py:'dòng',pos:'動詞',deep:'「動」字以有形寫無形。蓮葉本靜，一「動」字寫漁舟順流而下，反襯水面之平靜。與上句「喧」字對舉，一寫聲、一寫形，一聲一形，皆為「以動襯靜」之筆。「動」字與「空」字相應——「空」是寂靜本體，「動」是現象流轉；動靜之間，見佛法「不生不滅」之義。'},
    {w:'下',d:'順流而下',py:'xià',pos:'動詞',deep:'「下」字寫漁舟順流而下。一「下」字有自然之意——漁舟順水而下，即任運而為，非有意為之。此「下」字與「空」字相應——「空」是無執，「下」是任運；無執而任運，即禪家之「隨緣行」。'}
   ],
   rhet:[{t:'對偶',p:'竹喧歸浣女／蓮動下漁舟',e:'對仗工整，且以「喧」「動」二字寫出聲與形。此聯不僅對仗精工，更在對仗中見田園之樂、見自然之和，為唐詩對偶之名品。'}],
   tech:'以動襯靜——以喧鬧與晃動反襯山居的幽靜，亦寫出田園生活之樂，此為王維山水詩之核心手法之一',
   point:'常考「以動襯靜」的手法及「喧」「動」的作用；「歸」「下」二字與禪家「隨緣行」的關聯為5**以上之鑑賞要點',
   emotion:'純樸歡快之情。王維以「竹喧」「蓮動」寫田園生活，語氣歡快。此情非一般之歡快，而是禪家「隨緣行」之自在——見一切眾生皆得其所，見一切萬物皆得其所。',
   symbol:'「竹喧歸浣女，蓮動下漁舟」象徵田園生活的純樸與和諧，亦象徵萬物各得其所之禪境。「竹喧」見浣女之歸，「蓮動」見漁舟之流——一歸一流，皆任運而行，皆隨緣而動。此即王維「山水有清音」之極致。',
   deep:'此聯以動襯靜，以「喧」寫聲、以「動」寫形，反襯山居之幽靜，同時寫出田園生活之樂。王維以聲寫靜、以形寫靜，將田園生活寫得生機盎然，體現其對田園生活的嚮往。此聯之妙，在於「以喧寫靜」與「以動寫靜」之雙重手法——喧囂之中見寂靜，動盪之中見安寧。此即王維「動靜不二」之禪學。較之上聯「明月松間照，清泉石上流」之寫自然，此聯寫人事，一自然一人事，一天一人的，見王維山水詩之完整——山水與田園合為一體，自然與人事融為一境。'},
  {text:'隨意春芳歇，王孫自可留。',
   trans:'任憑春天的花草凋謝吧，我這個隱居之人自然可以留在山中。',
   words:[
    {w:'隨意',d:'任憑、任隨',py:'suí yì',pos:'動詞',deep:'「隨意」二字有豁達自在之意，寫出詩人對春光消逝的不以為意，見其心境之從容。一「隨意」寫盡王維之禪心——不執著於春芳之盛，亦不惋惜春芳之歇。此「隨意」二字與《金剛經》「應無所住而生其心」相應——心無所住，故能隨意；隨意而行，即無所住。王維以「隨意」寫對春光之態度，實寫對生命之態度。'},
    {w:'歇',d:'凋謝、消歇',py:'xiē',pos:'動詞',deep:'「歇」字寫春芳之凋謝，本為衰颯之景，卻因「隨意」二字而無悲意。一「歇」字與上「隨意」相應，寫出萬物自然生滅之理。此「歇」字與《易經》「生生之謂易」相應——春芳雖歇，而萬物生生不息；一物之歇，即一物之生。王維以「歇」字寫春芳，見其對「無常」之徹悟。'},
    {w:'王孫',d:'本指貴族子弟，此為詩人自指',py:'wáng sūn',pos:'名詞',deep:'「王孫」本指貴族子弟，此處為詩人自指。王維反用《楚辭》「王孫兮歸來，山中兮不可久留」之典，以「自可留」三字表明心志——不歸塵世，長留山中。反用典故，見其歸隱之志之堅。此「王孫」二字，上承屈原《招隱士》之傳統，下開王維歸隱詩之新境。'},
    {w:'自可留',d:'自然可以留',py:'zì kě liú',pos:'動詞',deep:'「自可留」三字有斬釘截鐵之勢，寫出詩人留戀山林、決意歸隱的心志。一「自」字寫出自主選擇，非被迫，非無奈，而是主動的歸隱。此「自可留」三字與陶淵明「歸去來兮」相應——陶淵明以「歸去」明志，王維以「自可留」明志；一歸一去，一留一居，皆見歸隱之志。'}
   ],
   rhet:[{t:'用典',p:'王孫自可留',e:'反用《楚辭》「王孫兮歸來，山中兮不可久留」之意，表達留戀山林的心志。此為「反用典故」之典範——不順用典，而反用典，見詩人之創新。'}],
   tech:'直抒胸臆——點明歸隱之志，以反用典故收束全詩',
   point:'尾聯點明主旨，反用典故為高頻考點；「自可留」的語氣及與《楚辭》典故的關係為5**以上之鑑賞要點',
   emotion:'堅定從容的歸隱之情。王維以「自可留」點明心志，語氣堅定，表達留戀山林、不願出仕的情懷。此情非一般之堅定，而是禪家「隨緣行」之從容——隨緣而留，隨緣而去；無留無去，故能自可留。',
   symbol:'「王孫自可留」象徵詩人對山林隱居生活的堅守，反用典故，表達不與世俗同流的心志。「春芳歇」象徵世間繁華之消逝，「自可留」象徵詩人對永恆價值之堅守——不隨世俗而變，不隨繁華而遷。',
   deep:'此聯反用《楚辭》典故，以「隨意」寫對春光消逝之豁達，以「自可留」點明歸隱之志。一「隨意」一「自可」，寫盡王維禪心與歸志，為全詩作結，餘韻悠長。此聯之妙，在於「反用典故」與「隨緣而止」之雙重手法——反用典故，見詩人之創新；隨緣而止，見詩人之禪心。較之陶淵明「歸去來兮，田園將蕪胡不歸」之急切，王維之「自可留」更見從容——不急不迫，不歸不留，自在從容，此即王維之禪意。全詩以「空」始，以「留」終——「空」是體，「留」是用；「空」是本來面目，「留」是隨緣而行。一首山水詩，寫盡禪家之全體大用。'}
 ]},
 {name:'月下獨酌（李白）',sentences:[
  {text:'花間一壺酒，獨酌無相親。',
   trans:'花叢中擺著一壺酒，我獨自飲酒，沒有親近的人相伴。',
   words:[
    {w:'花間',d:'花叢中',py:'huā jiān',pos:'名詞',deep:'「花間」二字寫地點之美。一「花」字寫花之美，一「間」字寫花叢之中，見環境之優美。此「花間」二字上承《詩經》「桃之夭夭」之傳統，下開李白浪漫詩之新境。然花之美景與孤獨之心情形成強烈反差，樂景寫哀情，倍增其哀。此「花間」二字，實為全詩之反襯——花之美，愈見人之孤。'},
    {w:'一壺',d:'一壺酒',py:'yī hú',pos:'名詞',deep:'「一壺」二字寫酒之少。一「一」字寫孤獨，一「壺」字寫酒器，見獨酌之狀。此「一壺」與「獨酌」相應——一壺酒，一人酌，愈見其孤。此「一」字與後文「三人」形成強烈對比——「一」是本相，「三人」是幻相；從「一」到「三人」，是李白以想像力超越現實之孤獨。'},
    {w:'獨',d:'獨自',py:'dú',pos:'副詞',deep:'「獨」為全詩情感核心，一字貫穿全篇。此「獨」非僅身之獨，更是心之獨——無人可語、無人可伴。全詩後文邀月、對影、歌舞、相期，皆由此「獨」字生出。此「獨」字上承《古詩十九首》「獨宿累長夜」之孤獨，下開李白「古來聖賢皆寂寞」之主題。李白之「獨」非消極之孤獨，而是主動之獨——不甘孤獨，故邀月對影，以想像力超越孤獨，此為李白之浪漫精神。'},
    {w:'無相親',d:'沒有親近的人',py:'wú xiāng qīn',pos:'動詞',deep:'「無相親」三字是「獨」字的註腳。一「無」字寫盡孤獨——非無酒，非無花，而是無人。李白以「花間」「一壺酒」之美景反襯「無相親」之孤獨，樂景寫哀情，倍增其哀。此「無相親」三字與王維「獨在異鄉為異客」之「異客」相應——一寫無親，一寫異鄉，皆見孤獨之深。'}
   ],
   rhet:[],tech:'敘事起筆——點明「獨」字，奠定全詩孤獨基調，以樂景寫哀情',
   point:'「獨」字為全詩情感核心，常考其統攝作用；「花間」與「無相親」的反差為高頻考點；「一壺」與「三人」的對比為5**以上之鑑賞要點',
   emotion:'孤獨寂寞的愁緒之情。李白以「獨酌無相親」點明孤獨，語氣略帶惆悵，為全詩奠定基調。此情非一般之孤獨，而是天才之孤獨——舉世無知音，唯有明月與影子可為伴。',
   symbol:'「花間一壺酒」象徵美好的環境；「獨酌無相親」象徵孤獨無伴的處境。二者形成強烈反差——美景愈美，孤獨愈深。此即王夫之《薑齋詩話》所謂「以樂景寫哀，以哀景寫樂，一倍增其哀樂」。',
   deep:'此句以「花間一壺酒」寫美景，以「獨酌無相親」寫孤獨，美景與孤獨形成強烈反差。一「獨」字統攝全篇，為後文邀月對影的奇想鋪墊，見李白以孤獨為起點、以曠達為歸宿的浪漫精神。此句之妙，在於「一壺」與「獨酌」之呼應——一壺酒，一人酌，孤獨之極，卻由此生出全詩之奇想。此即李白之浪漫——以孤獨為起點，以想像為翅膀，以曠達為歸宿。'},
  {text:'舉杯邀明月，對影成三人。',
   trans:'舉起酒杯邀請明月，對著自己的影子，就成了三個人。',
   words:[
    {w:'舉杯',d:'舉起酒杯',py:'jǔ bēi',pos:'動詞',deep:'「舉杯」二字寫動作之豪邁。一「舉」字寫舉起，一「杯」字寫酒杯，見豪放之態。此「舉杯」二字與李白《將進酒》「人生得意須盡歡，莫使金樽空對月」之「金樽」相應——皆寫飲酒之豪。此「舉杯」為全詩之轉折——由「獨酌」之孤獨，轉為「邀月」之狂歡。'},
    {w:'邀',d:'邀請',py:'yāo',pos:'動詞',deep:'「邀」字為全詩關鍵。月本無情，李白卻「邀」之，將被動之孤獨化為主動之狂歡。一「邀」字見李白之主體精神——不甘孤獨，主動拉月入局，化孤獨為熱鬧。此「邀」非求伴，而是以想像創造伴侶，是浪漫主義之極致。此「邀」字與蘇軾「舉杯邀明月」之「邀」相應——然蘇軾之「邀」是詞中之雅，李白之「邀」是詩中之狂。李白之「邀」有主動性、創造性、主體性——非被動接受孤獨，而是主動超越孤獨。'},
    {w:'明月',d:'明月',py:'míng yuè',pos:'名詞',deep:'「明月」二字寫月之明。一「明」字寫亮，一「月」字寫月，見月之明。此「明月」二字上承《詩經》「月出皎兮」之傳統，下開李白「明月」意象之新境。此「明月」非一般之月，而是永恆之月——月照古今，亙古不變；人雖孤獨，而月永恆相伴。此「明月」象徵永恆之知音——雖無情，卻永恆。'},
    {w:'對影',d:'對著自己的影子',py:'duì yǐng',pos:'動詞',deep:'「對影」二字有正視之意。李白「對影」，非逃避孤獨，而是正視孤獨，與影為伴。一「對」字見其坦然面對孤獨之胸襟。此「對影」二字與陶淵明「顧影獨盡」之「顧影」相應——然陶淵明之「顧影」是隱士之孤，李白之「對影」是詩人之狂。'},
    {w:'成三人',d:'成為三個人',py:'chéng sān rén',pos:'動詞',deep:'「成三人」為全詩奇想之核心。一人、一月、一影，本為孤獨之景，李白卻以「成三人」化孤為眾。一「成」字有主動創造之意——不是「有」三人，而是「成」三人，見李白以想像力創造熱鬧之奇才。此「成三人」三字與《莊子》「天地與我並生，萬物與我為一」相應——莊子之「為一」是哲學之齊物，李白之「三人」是詩學之奇想。李白以「三人」寫孤獨之超越——從「一」到「三」，是李白以想像力超越現實之孤獨。'}
   ],
   rhet:[{t:'想像',p:'對影成三人',e:'以奇特的想像化孤獨為熱鬧，展現李白浪漫曠達的個性，是千古名句。此為「以虛寫實」之典範——以想像中之「三人」反襯現實之孤獨。'}],
   tech:'以虛寫實——用想像中的「三人」反襯現實的孤獨，此為李白浪漫主義之核心手法',
   point:'名句，常考「三人」所指及「邀」「成」二字的作用；「邀」字的主體精神與「成」字的創造性為5**以上之鑑賞要點',
   emotion:'孤獨中的曠達之情。李白以奇特想像邀月對影，化孤獨為熱鬧，語氣豪放，展現其浪漫曠達的個性。此情非一般之曠達，而是天才之曠達——以想像力超越孤獨，以主體精神對抗虛無。',
   symbol:'「三人」象徵詩人、明月、影子，是孤獨中的精神伴侶。此「三人」象徵李白對孤獨之超越——不是逃避孤獨，而是以想像力創造伴侶；不是否認孤獨，而是以曠達超越孤獨。此「三人」與《論語》「三人行，必有我師焉」之「三人」相應——一寫師友，一寫伴侶，皆見孤獨中求伴之心。',
   deep:'此句以奇特想像邀月對影，化孤獨為熱鬧。「邀」字見主動，「成」字見創造，「三人」指詩人、明月、影子。李白以浪漫的想像排解孤獨，將一己之獨化為三人之歡，展現其曠達超脫的個性，是浪漫主義詩歌之極致。此句之妙，在於「邀」與「成」二字——「邀」是行動，「成」是結果；「邀」是主動，「成」是創造。李白以「邀」打破孤獨，以「成」創造伴侶，將孤獨之被動化為主動，將現實之孤獨化為想像之熱鬧。此即李白之浪漫主義——以主體精神對抗客觀現實，以想像力超越現實之限制。'},
  {text:'月既不解飲，影徒隨我身。',
   trans:'月亮既不懂得飲酒，影子也只是白白地跟隨我的身體。',
   words:[
    {w:'既',d:'既然、已經',py:'jì',pos:'副詞',deep:'「既」字有轉折之意，由想像之熱鬧轉回現實之孤寂。一「既」字點破幻想，見李白之清醒——明知月不解飲，卻仍邀之，是明知不可而為之的浪漫。此「既」字與《論語》「既來之，則安之」之「既」相應——一寫時間之接，一寫轉折之意。李白以「既」字點破幻想，見其清醒與浪漫並存——清醒地知道月不解飲，卻浪漫地邀月對影。'},
    {w:'不解',d:'不懂得',py:'bù jiě',pos:'動詞',deep:'「不解」二字寫月之無情。月本無情，一「不解」字寫盡其遺憾——雖相伴，卻不能共飲；雖同席，卻不能同樂。此為全詩孤獨之深化。此「不解」二字與李商隱「嫦娥應悔偷靈藥」之「悔」相應——一寫不解，一寫悔恨，皆見月之無情。李白以「不解」寫月，見其對孤獨之清醒認識——月雖相伴，卻不能共飲。'},
    {w:'徒',d:'只是、白白地',py:'tú',pos:'副詞',deep:'「徒」字有無奈之意。影本無情，一「徒」字寫出影雖隨身，卻無實益。一「徒」字與上句「不解」相應，寫出精神伴侶之虛幻，現實孤獨之深沉。此「徒」字與《古詩十九首》「徒倚懷感傷」之「徒」相應——一寫徒倚，一寫徒隨，皆見無奈之意。李白以「徒」字寫影，見其對孤獨之清醒認識——影雖隨身，卻無實益。'},
    {w:'隨我身',d:'跟隨我的身體',py:'suí wǒ shēn',pos:'動詞',deep:'「隨我身」三字寫影之無情。一「隨」字寫跟隨，一「我身」寫身體，見影之被動。此「隨我身」三字與陶淵明「形影神」之「影」相應——陶淵明以「影」寫生命之執著，李白以「影」寫孤獨之無奈。'}
   ],
   rhet:[{t:'擬人',p:'月既不解飲',e:'將月人格化，寫出月雖相伴卻不能共飲的遺憾。此為「擬人」之變格——不寫月之有情，而寫月之無情；不寫月之相伴，而寫月之不解。'}],
   tech:'轉折——由想像的熱鬧轉回現實的孤寂，此為全詩之關鍵轉折',
   point:'「徒」解作「只是」為常考字詞；「既」「徒」二字的轉折作用為高頻考點；「不解」與「徒隨」的對舉為5**以上之鑑賞要點',
   emotion:'無奈惆悵之情。李白寫月不解飲、影徒隨身，語氣無奈。此情非一般之無奈，而是天才之無奈——明知不可而仍為之，明知無情而仍邀之。',
   symbol:'「月既不解飲，影徒隨我身」象徵精神伴侶的虛幻與現實的孤獨。「月」象徵永恆之知音，卻「不解飲」；「影」象徵忠實之伴侶，卻「徒隨身」。此即李白之孤獨——永恆之知音不解飲，忠實之伴侶徒隨身。',
   deep:'此句由想像的熱鬧轉回現實的孤寂，一「既」字點破幻想，一「徒」字寫盡無奈。月不解飲，影徒隨身，精神伴侶之虛幻，正是孤獨之深沉。李白明知不可而仍邀月對影，見其浪漫精神之執著。此句之妙，在於「既」與「徒」二字——「既」是轉折，「徒」是無奈；「既」是清醒，「徒」是悲哀。李白以「既」點破幻想，以「徒」寫盡無奈，見其清醒與浪漫並存——清醒地知道月不解飲，卻仍浪漫地邀月對影；明知影徒隨身，卻仍與影為伴。此即李白之浪漫主義——以清醒之認識，行浪漫之行動。'},
  {text:'暫伴月將影，行樂須及春。',
   trans:'暫且伴著月亮和影子，行樂要趁著春天。',
   words:[
    {w:'暫',d:'暫且、暫時',py:'zàn',pos:'副詞',deep:'「暫」字有珍惜當下之意。既知月影無情，仍「暫伴」之，是明知短暫而仍珍惜的曠達。一「暫」字見李白之通達——不強求永恆，只珍惜眼前。此「暫」字與《古詩十九首》「人生忽如寄」之「忽」相應——一寫暫伴，一寫忽寄，皆見生命之短暫。李白以「暫」字寫陪伴，見其對生命之珍惜。'},
    {w:'伴',d:'陪伴',py:'bàn',pos:'動詞',deep:'「伴」字寫陪伴。一「伴」字有相伴之意，見李白與月影之關係。此「伴」字與王維「獨坐幽篁裡」之「獨坐」相應——一寫相伴，一寫獨坐，皆見人與自然之關係。李白以「伴」字寫月影，見其對孤獨之超越——雖知月影無情，卻仍以之為伴。'},
    {w:'須',d:'必須、應當',py:'xū',pos:'副詞',deep:'「須」字有斬釘截鐵之勢，寫出「行樂須及春」的決斷。一「須」字見李白之人生態度——及時行樂，不負春光。此「須」字與《古詩十九首》「為樂當及時」之「當」相應——一寫須，一寫當，皆見及時行樂之意。李白以「須」字寫行樂，見其對生命之熱愛。'},
    {w:'及春',d:'趁著春天',py:'jí chūn',pos:'動詞',deep:'「及春」二字寫時間之緊迫。一「及」字寫趁著，一「春」字寫春天，見時間之緊迫。此「及春」二字與陶淵明「及時當勉勵」之「及時」相應——一寫及春，一寫及時，皆見珍惜時光之意。李白以「及春」寫行樂，見其對時光之珍惜。'}
   ],
   rhet:[],tech:'抒情——由孤獨轉為及時行樂的自我排解，此為李白人生哲學之核心',
   point:'常考詩人情感由悲轉達的轉折；「暫」「須」「及」三字的語氣為高頻考點；「行樂須及春」與《古詩十九首》的互文性為5**以上之鑑賞要點',
   emotion:'自我排解的曠達之情。李白以「行樂須及春」自我排解，語氣轉為曠達。此情非一般之曠達，而是魏晉風度之曠達——以「暫」寫短暫，以「須」寫決斷，以「及」寫緊迫，三字連用，見李白對生命之熱愛與對時光之珍惜。',
   symbol:'「行樂須及春」象徵在孤獨中及時行樂的曠達。「月將影」象徵孤獨中之伴侶，「行樂及春」象徵孤獨中之行樂——以行樂超越孤獨，以曠達超越無奈。',
   deep:'此句由孤獨轉為及時行樂的自我排解。一「暫」字珍惜當下，一「須」字斬釘截鐵，一「及」字寫時光緊迫。三字連用，見李白在孤獨中仍能曠達自適、及時行樂的人生態度。此句之妙，在於「暫」與「須」二字——「暫」是珍惜，「須」是決斷；「暫」是無奈，「須」是主動。李白以「暫」字承認短暫，以「須」字超越無奈，見其對生命之熱愛——明知短暫，仍須行樂；明知孤獨，仍須曠達。此即李白之人生哲學——以行樂對抗孤獨，以曠達對抗虛無。'},
  {text:'我歌月徘徊，我舞影零亂。',
   trans:'我唱歌時月亮徘徊不去，我跳舞時影子零亂紛雜。',
   words:[
    {w:'我歌',d:'我唱歌',py:'wǒ gē',pos:'動詞',deep:'「我歌」二字寫詩人之歌。一「我」字寫主體，一「歌」字寫歌唱，見主體之主動。此「我歌」二字與《詩經》「我歌且謠」之「我歌」相應——一寫我歌，一寫我歌，皆見主體之主動。李白以「我歌」寫主體之主動，見其對孤獨之超越——不是被動承受孤獨，而是主動歌唱。'},
    {w:'徘徊',d:'來回走動，此指月隨人行',py:'pái huái',pos:'動詞',deep:'「徘徊」二字寫月隨人行，賦予月以人的情態。一「徘徊」寫出月之不捨，彷彿真為知音。此為擬人之妙——將無情之月寫成有情之伴。此「徘徊」二字與《古詩十九首》「明月何皎皎，照我羅床幃」之「照」相應——一寫徘徊，一寫照，皆見月之相伴。李白以「徘徊」寫月，見其對月之深情——月雖無情，卻徘徊不去。'},
    {w:'我舞',d:'我跳舞',py:'wǒ wǔ',pos:'動詞',deep:'「我舞」二字寫詩人之舞。一「我」字寫主體，一「舞」字寫跳舞，見主體之主動。此「我舞」二字與陶淵明「我舞影零亂」之「我舞」相應——一寫我舞，一寫我舞，皆見主體之主動。李白以「我舞」寫主體之主動，見其對孤獨之超越——不是被動承受孤獨，而是主動跳舞。'},
    {w:'零亂',d:'紛亂不整',py:'líng luàn',pos:'形容詞',deep:'「零亂」二字寫影隨舞亂，寫出酒後放達、形神俱忘之境。一「零亂」非寫影之亂，而是寫人之放——放達至影亦零亂，見李白酒後之狂放。此「零亂」二字與張旭「脫帽露頂王公前」之「脫帽」相應——一寫零亂，一寫脫帽，皆見狂放之意。李白以「零亂」寫影，見其酒後之狂放——放達至影亦零亂，見其狂放之極。'}
   ],
   rhet:[{t:'擬人',p:'我歌月徘徊',e:'賦予月亮以人的情態，寫出物我交融之樂。此為「擬人」之妙——將無情之月寫成有情之伴。'}],
   tech:'動作描寫——以歌、舞寫出酒後的放達，此為李白浪漫主義之核心手法',
   point:'常考擬人手法及其表達效果；「徘徊」「零亂」二詞的意境為高頻考點；「我歌」「我舞」的主體性為5**以上之鑑賞要點',
   emotion:'放達歡快之情。李白以「我歌月徘徊，我舞影零亂」寫酒後的放達，語氣歡快。此情非一般之歡快，而是魏晉風度之狂放——以歌寫主體之主動，以舞寫主體之狂放。',
   symbol:'「我歌月徘徊，我舞影零亂」象徵詩人與月、影融為一體的精神境界。「月徘徊」象徵月之相伴，「影零亂」象徵影之相隨——月與影皆隨詩人而動，見物我合一之境。',
   deep:'此句以擬人與動作描寫，寫出李白酒後放達、物我交融的精神境界。一「徘徊」寫月之不捨，一「零亂」寫影之紛亂，月隨我歌、影隨我舞，物我合一，見李白浪漫之極致。此句之妙，在於「我歌」與「我舞」之對舉——「我歌」是聲，「我舞」是形；「我歌」是聽覺，「我舞」是視覺。李白以聲與形、聽與視，寫出物我合一之境——月隨我歌而徘徊，影隨我舞而零亂。此即李白之浪漫主義——以主體之主動，超越客觀之限制；以物我之合一，超越孤獨之悲哀。'},
  {text:'醒時同交歡，醉後各分散。',
   trans:'清醒時一同歡樂，醉後便各自分散。',
   words:[
    {w:'醒時',d:'清醒時',py:'xǐng shí',pos:'名詞',deep:'「醒時」二字寫清醒之時。一「醒」字寫清醒，一「時」字寫時候，見清醒之時。此「醒時」二字與《楚辭》「眾人皆醉我獨醒」之「醒」相應——一寫醒時，一寫獨醒，皆見清醒之意。李白以「醒時」寫清醒，見其對孤獨之清醒認識。'},
    {w:'同交歡',d:'一同歡樂',py:'tóng jiāo huān',pos:'動詞',deep:'「同交歡」三字寫一同歡樂。一「同」字寫一同，一「交歡」寫歡樂，見一同歡樂之意。此「同交歡」三字與《古詩十九首》「同袍與我違」之「同」相應——一寫同歡，一寫同袍，皆見一同之意。李白以「同交歡」寫歡樂，見其對孤獨之超越。'},
    {w:'醉後',d:'醉後',py:'zuì hòu',pos:'名詞',deep:'「醉後」二字寫醉後之時。一「醉」字寫醉，一「後」字寫之後，見醉後之時。此「醉後」二字與陶淵明「醉後各分散」之「醉後」相應——一寫醉後，一寫醉後，皆見醉後之意。李白以「醉後」寫分散，見其對孤獨之無奈。'},
    {w:'各分散',d:'各自分散',py:'gè fēn sàn',pos:'動詞',deep:'「各分散」三字寫各自分散。一「各」字寫各自，一「分散」寫分散，見各自分散之意。此「各分散」三字與《古詩十九首》「各在天一涯」之「各」相應——一寫各分散，一寫各天涯，皆見分散之意。李白以「各分散」寫分散，見其對孤獨之無奈。'}
   ],
   rhet:[],tech:'敘述——寫出聚散無常，暗含孤獨，此為全詩之深化',
   point:'常考此句所流露的深層孤獨感；「同」「各」二字的對舉為高頻考點；「醒時同交歡，醉後各分散」的聚散無常為5**以上之鑑賞要點',
   emotion:'感慨無常之情。李白寫聚散無常，語氣中暗含孤獨。此情非一般之無常，而是佛家「諸行無常」之無常——醒時同歡，醉後分散；聚散無常，人生如夢。',
   symbol:'「醒時同交歡，醉後各分散」象徵人生聚散無常。「醒時同交歡」象徵相聚之樂，「醉後各分散」象徵離散之悲——一聚一散，一樂一悲，見人生之無常。',
   deep:'此句寫出聚散無常，一「同」字寫相聚之樂，一「各」字寫離散之悲，對舉之中見孤獨之深化。為後文相期雲漢作鋪墊，見李白由孤獨到超脫之心路。此句之妙，在於「同」與「各」二字——「同」是相聚，「各」是離散；「同」是暫時，「各」是永恆。李白以「同」寫相聚之短暫，以「各」寫離散之必然，見其對人生之深刻認識——聚散無常，人生如夢。此即佛家「諸行無常」之義——以「同」「各」二字，寫盡人生之無常。'},
  {text:'永結無情遊，相期邈雲漢。',
   trans:'永遠結為忘情的伴侶一同遊樂，相約在遙遠的銀河相見。',
   words:[
    {w:'永',d:'永遠',py:'yǒng',pos:'副詞',deep:'「永」字有永恆之意。上句「醒時同交歡，醉後各分散」寫短暫之聚散，此「永」字寫永恆之相期，一短一長，一散一結，見李白對永恆之追求。此「永」字與《詩經》「永以為好也」之「永」相應——一寫永結，一寫永好，皆見永恆之意。李白以「永」字寫相期，見其對永恆之追求——以永恆超越短暫，以永恆超越無常。'},
    {w:'無情遊',d:'忘卻世俗之情的交遊',py:'wú qíng yóu',pos:'名詞',deep:'「無情」指忘卻世俗之情，「無情遊」即忘情的交遊。一「無情」二字寫出超越世俗、不摻功利的精神交往，見李白對純粹精神伴侶之追求。此「無情」二字與《莊子》「無情者，言人之不以好惡內傷其身」之「無情」相應——莊子之「無情」是哲學之超越，李白之「無情」是詩學之超越。李白以「無情」寫交遊，見其對純粹精神伴侶之追求。'},
    {w:'相期',d:'相約',py:'xiāng qī',pos:'動詞',deep:'「相期」指相約、互相約定。一「期」字有期待之意，寫出李白對未來永恆相伴之期盼。此「相期」二字與《詩經》「期我乎桑中」之「期」相應——一寫相期，一寫期我，皆見相約之意。李白以「相期」寫相約，見其對永恆相伴之期盼。'},
    {w:'邈',d:'遙遠',py:'miǎo',pos:'形容詞',deep:'「邈」字有高遠之意。一「邈」字寫出雲漢之遙遠，非世俗所能及，見李白精神境界之高遠。此「邈」字與《楚辭》「邈漫漫之不可量兮」之「邈」相應——一寫邈雲漢，一寫邈漫漫，皆見高遠之意。李白以「邈」字寫雲漢，見其精神境界之高遠。'},
    {w:'雲漢',d:'銀河',py:'yún hàn',pos:'名詞',deep:'「雲漢」指銀河，此處象徵高遠的精神寄託。一「雲漢」二字將全詩由現實之孤獨，提升至宇宙之高遠，見李白浪漫之極致。此「雲漢」二字與《詩經》「倬彼雲漢」之「雲漢」相應——一寫雲漢，一寫雲漢，皆見銀河之意。李白以「雲漢」寫寄託，見其精神境界之高遠——以雲漢超越現實，以永恆超越無常。'}
   ],
   rhet:[{t:'想像',p:'相期邈雲漢',e:'以超現實的想像作結，將孤獨昇華為永恆的精神寄託，意境高遠。此為「浪漫主義收束」之典範——以想像超越現實，以永恆超越無常。'}],
   tech:'浪漫主義收束——由現實的孤獨走向精神的高遠，此為李白浪漫主義之核心手法',
   point:'「雲漢」的解釋及結句的意境為常考；「永」「邈」二字的語氣為高頻考點；「無情遊」與《莊子》「無情」的互文性為5**以上之鑑賞要點',
   emotion:'超脫曠達的永恆之情。李白以「相期邈雲漢」作結，語氣豪邁，將孤獨昇華為永恆的精神寄託。此情非一般之曠達，而是莊子「逍遙遊」之曠達——以永恆超越短暫，以宇宙超越人生。',
   symbol:'「雲漢」象徵高遠的精神境界；「永結無情遊」象徵超越世俗的精神追求。「雲漢」與「無情遊」疊加，構成李白精神追求之最高境界——以雲漢之永恆，超越人生之無常；以無情之超越，超越世俗之紛擾。',
   deep:'此句以超現實的想像作結，一「永」字寫永恆，一「邈」字寫高遠，一「雲漢」寫精神之寄託。李白與月、影相約於銀河，超越現實的孤獨，達到精神的高遠。此結句意境宏闊，餘韻無窮，是浪漫主義詩歌之極致。此句之妙，在於「永」與「邈」二字——「永」是時間之永恆，「邈」是空間之高遠。李白以「永」超越時間之無常，以「邈」超越空間之限制，見其精神境界之無限。此即莊子「逍遙遊」之義——以無待超越有待，以無限超越有限。李白與月、影相約於雲漢，即莊子與天地精神往來——一詩一哲，皆見中國文化之最高境界。'}
 ]},
 {name:'登樓（杜甫）',sentences:[
  {text:'花近高樓傷客心，萬方多難此登臨。',
   trans:'繁花靠近高樓，卻傷了我這客居之人的心；在四方多難之際，我在這裡登樓遠望。',
   words:[
    {w:'花近',d:'繁花靠近',py:'huā jìn',pos:'動詞',deep:'「花近」二字寫繁花之近。一「花」字寫花之美，一「近」字寫靠近，見花之盛。此「花近」二字與杜甫《春望》「國破山河在，城春草木深」之「草木深」相應——一寫花近，一寫草深，皆見春景之盛。然花之盛景與國之災難形成強烈反差，樂景寫哀情，倍增其哀。此「花近」二字，實為全詩之反襯——花之盛，愈見國之衰。'},
    {w:'高樓',d:'高樓',py:'gāo lóu',pos:'名詞',deep:'「高樓」二字寫樓之高。一「高」字寫高，一「樓」字寫樓，見樓之高。此「高樓」二字與杜甫《登高》「萬里悲秋常作客」之「登高」相應——一寫高樓，一寫登高，皆見登臨之意。杜甫以「高樓」寫登臨之所，見其登高望遠之志——登高望遠，本為望鄉，卻見萬方多難。'},
    {w:'傷客心',d:'傷了客居之人的心',py:'shāng kè xīn',pos:'動詞',deep:'「傷客心」三字寫傷心。一「傷」字寫傷，一「客心」寫客居之心，見客居之痛。此「傷客心」三字與《古詩十九首》「遊子寒無衣」之「遊子」相應——一寫客心，一寫遊子，皆見客居之痛。杜甫以「客心」自稱，見其漂泊之痛——客居他鄉，本已傷心，更見萬方多難，倍增其痛。'},
    {w:'萬方多難',d:'各地多災多難',py:'wàn fāng duō nàn',pos:'成語',deep:'「萬方」指各地，「多難」指多災多難，指國家動盪。此四字將個人之「傷」置於天下大亂的背景中，使一己之悲昇華為家國之痛。此「萬方多難」四字與《詩經》「萬方多難」之「萬方」相應——一寫萬方，一寫萬方，皆見各地之意。杜甫以「萬方多難」寫國難，見其家國情懷——以一己之悲，寫天下之痛。'},
    {w:'登臨',d:'登樓遠望',py:'dēng lín',pos:'動詞',deep:'「登臨」指登樓遠望。杜甫登樓非為遊賞，而是於萬方多難之際登高望遠，胸中塊壘借登臨而發，一「臨」字有俯仰天地之勢。此「登臨」二字與《楚辭》「登崑崙兮四望」之「登」相應——一寫登臨，一寫登崑崙，皆見登高之意。杜甫以「登臨」寫登樓，見其胸懷之廣——登高望遠，非為遊賞，而為憂國。'}
   ],
   rhet:[{t:'反襯',p:'花近高樓傷客心',e:'以樂景（繁花）寫哀情，春色愈美，愈襯出內心之痛，是杜甫常用的手法。此為「以樂景寫哀情」之典範——以花之盛，反襯國之衰；以春之美，反襯心之痛。'}],
   tech:'以樂景寫哀情——開篇即定下沉鬱基調，此為杜甫詩之核心手法',
   point:'「以樂景寫哀情」為高頻考點；「客」的指代常考；「萬方多難」與個人之悲的關係為5**以上之鑑賞要點',
   emotion:'沉鬱悲涼的憂國之情。杜甫以繁花反襯傷心，語氣沉重，奠定全詩憂國傷時的基調。此情非一般之憂國，而是儒家「憂以天下」之憂——以一己之悲，寫天下之痛。',
   symbol:'「花近高樓」象徵美好的春景；「傷客心」象徵詩人內心的憂國之痛。樂景與哀情形成強烈反差——花之盛，愈見國之衰；春之美，愈見心之痛。此即王夫之《薑齋詩話》所謂「以樂景寫哀，以哀景寫樂，一倍增其哀樂」。',
   deep:'此聯以樂景寫哀情，繁花似錦卻傷客心，春色愈美，愈襯出內心的憂國之痛。杜甫以此開篇，點明「萬方多難」的時代背景，奠定全詩沉鬱頓挫的基調。此聯之妙，在於「花近」與「傷心」之對舉——「花近」是樂景，「傷心」是哀情；以樂景寫哀情，倍增其哀。此即杜甫「沉鬱頓挫」之風格——以樂景寫哀，以美景寫痛，愈見其痛之深。'},
  {text:'錦江春色來天地，玉壘浮雲變古今。',
   trans:'錦江的春色鋪天蓋地而來，玉壘山的浮雲變幻著古往今來。',
   words:[
    {w:'錦江',d:'成都錦江',py:'jǐn jiāng',pos:'名詞',deep:'「錦江」指成都的錦江，是當地的名勝。杜甫以「錦江」起筆，點明登樓所見之地。此「錦江」二字與杜甫《春夜喜雨》「曉看紅濕處，花重錦官城」之「錦官城」相應——一寫錦江，一寫錦官城，皆見成都之意。杜甫以「錦江」寫地點，見其對成都之熟悉。'},
    {w:'春色',d:'春天的景色',py:'chūn sè',pos:'名詞',deep:'「春色」二字寫春天之景色。一「春」字寫春天，一「色」字寫景色，見春天之景。此「春色」二字與杜甫《春望》「城春草木深」之「城春」相應——一寫春色，一寫城春，皆見春天之意。杜甫以「春色」寫春天，見其對春天之感受。'},
    {w:'來',d:'到來、鋪天蓋地而來',py:'lái',pos:'動詞',deep:'「來」字有不可擋之勢。錦江春色本為靜態景物，杜甫用「來」字將春色擬人化、主動化，彷彿春色挾天地之勢鋪天蓋地而來。一「來」字寫出春意之浩蕩、氣勢之磅礴，是杜詩煉字的典範。此「來」字與李白「黃河之水天上來」之「來」相應——一寫春色來，一寫黃河來，皆見氣勢之磅礴。杜甫以「來」字寫春色，見其煉字之精——以一字寫盡春色之浩蕩。'},
    {w:'天地',d:'天地',py:'tiān dì',pos:'名詞',deep:'「天地」二字寫空間之廣。一「天」字寫天，一「地」字寫地，見空間之廣。此「天地」二字與《易經》「天地之大德曰生」之「天地」相應——一寫天地，一寫天地，皆見空間之廣。杜甫以「天地」寫空間，見其胸懷之廣——春色來天地，即春色滿天下。'},
    {w:'玉壘',d:'玉壘山，在成都西北',py:'yù lěi',pos:'名詞',deep:'「玉壘」指玉壘山，在成都西北。與「錦江」對舉，一水一山，一近一遠，拓展空間意境。此「玉壘」二字與杜甫《登高》「玉壘浮雲變古今」之「玉壘」相應——一寫玉壘，一寫玉壘，皆見山名之意。杜甫以「玉壘」寫山，見其對成都之熟悉。'},
    {w:'浮雲',d:'浮雲',py:'fú yún',pos:'名詞',deep:'「浮雲」二字寫雲之浮。一「浮」字寫浮，一「雲」字寫雲，見雲之浮。此「浮雲」二字與《古詩十九首》「浮雲蔽白日」之「浮雲」相應——一寫浮雲，一寫浮雲，皆見雲之浮。杜甫以「浮雲」寫雲，見其對歷史之感慨——浮雲變古今，即歷史如浮雲。'},
    {w:'變',d:'變幻、變遷',py:'biàn',pos:'動詞',deep:'「變」字寫浮雲之幻化，將古今興亡壓縮於一瞬。與上句「來」字對舉：一「來」寫空間之浩蕩，一「變」寫時間之蒼茫，時空交錯，氣象宏大，見杜詩沉鬱頓挫之本色。此「變」字與《易經》「窮則變，變則通」之「變」相應——一寫變古今，一寫變通，皆見變化之意。杜甫以「變」字寫浮雲，見其對歷史之深刻認識——浮雲變古今，即歷史無常。'},
    {w:'古今',d:'古往今來',py:'gǔ jīn',pos:'名詞',deep:'「古今」指古往今來。杜甫以「變古今」三字，將歷史的興亡變遷凝縮於浮雲一變之中，內涵深遠。此「古今」二字與《楚辭》「往古來今」之「古今」相應——一寫古今，一寫往古來今，皆見時間之廣。杜甫以「古今」寫時間，見其對歷史之感慨——浮雲變古今，即歷史如浮雲，無常而變。'}
   ],
   rhet:[{t:'對偶',p:'錦江春色來天地／玉壘浮雲變古今',e:'空間（天地）與時間（古今）相對，一「來」一「變」皆為煉字典範，氣象宏大，內涵深遠，是杜詩名句。此為「時空對舉」之典範——以空間之廣，對時間之長；以春色之來，對浮雲之變。'}],
   tech:'借景抒情——由眼前之景寫到古今之變，拓展意境，此為杜甫詩之核心手法',
   point:'常考此聯的時空對舉及「來」「變」二字的煉字效果；「來」字不可擋之勢為5******鑑賞之核心要點',
   emotion:'蒼茫深沉的歷史之情。杜甫以錦江春色、玉壘浮雲寫時空變幻，語氣蒼茫，抒發對古今興亡的感慨。此情非一般之感慨，而是儒家「究天人之際，通古今之變」之感慨——以空間之廣，寫時間之長；以春色之來，寫浮雲之變。',
   symbol:'「錦江春色」象徵空間的廣闊；「玉壘浮雲變古今」象徵時間的流逝與歷史的變遷。一空間一時間，一春色一浮雲，一來一變，構成杜甫對歷史之深刻認識——歷史如浮雲，無常而變；春色如人生，短暫而美。',

const LS = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem('wm_'+k)) ?? d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('wm_'+k, JSON.stringify(v)); }catch(e){} }
};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const $ = s => document.querySelector(s);

const state = { view:'read', chapter:0 };

function switchView(v){
  state.view = v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  $('#view-'+v).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
  if(v==='notes') renderNotes();
  if(v==='stats') renderStats();
  if(v==='framework') renderFramework();
}

function countSentences(c){ return c.sections.reduce((a,s)=>a+s.sentences.length,0); }

function renderSidebar(){
  const el = $('#sidebar');
  el.innerHTML = '<div class="sb-title"> 喜歡你的SB </div>' +
    CHAPTERS.map((c,i)=>`
      <div class="chap-item ${i===state.chapter?'on':''}" onclick="selectChapter(${i})">
        <div class="ci-num">${c.num}</div>
        <div class="ci-body">
          <div class="ci-title">${esc(c.title)}</div>
          <div class="ci-sub">${esc(c.author)} · ${esc(c.genre)}</div>
        </div>
      </div>`).join('');
}

function selectChapter(i){
  state.chapter = i;
  renderSidebar();
  renderReader();
  const c = $('#readerContent');
  if(c) c.scrollIntoView({behavior:'smooth',block:'start'});
  if(window.innerWidth<=900) window.scrollTo({top:0,behavior:'smooth'});
}

function markWords(text, words){
  if(!words || !words.length) return esc(text);
  const occupied = new Array(text.length).fill(false);
  const marks = [];
  const sorted = [...words].sort((a,b)=>b.w.length-a.w.length);
  sorted.forEach(item=>{
    if(!item.w) return;
    let idx = text.indexOf(item.w);
    while(idx !== -1){
      let ok = true;
      for(let k=idx;k<idx+item.w.length;k++){ if(occupied[k]){ ok=false; break; } }
      if(ok){
        for(let k=idx;k<idx+item.w.length;k++) occupied[k]=true;
        marks.push({s:idx,e:idx+item.w.length,item});
        break;
      }
      idx = text.indexOf(item.w, idx+1);
    }
  });
  marks.sort((a,b)=>a.s-b.s);
  let html='', pos=0;
  marks.forEach(m=>{
    if(m.s < pos) return;
    html += esc(text.slice(pos, m.s));
    html += `<span class="w" data-d="${esc(m.item.d)}" data-deep="${esc(m.item.deep||'')}" data-py="${esc(m.item.py||'')}" data-pos="${esc(m.item.pos||'')}" data-w="${esc(m.item.w)}">${esc(text.slice(m.s,m.e))}</span>`;
    pos = m.e;
  });
  html += esc(text.slice(pos));
  return html;
}

          s.words.map(w=>`
            <div class="word-item">
              <div class="word-head">
                <b>${esc(w.w)}</b>
                ${w.py?`<span class="py">${esc(w.py)}</span>`:''}
                ${w.pos?`<span class="pos">${esc(w.pos)}</span>`:''}
              </div>
              <div class="word-def">${esc(w.d)}</div>
              ${w.deep?`<div class="word-deep"><b>深層：</b>${esc(w.deep)}</div>`:''}
            </div>`).join('')
        }</div></div>`;
      }

      if(s.rhet && s.rhet.length){
        let r = '';
        s.rhet.forEach(x=>{
          r += `<div style="margin-bottom:8px;"><b style="color:#B23A2C;">${esc(x.t)}</b>｜「${esc(x.p)}」<br>${esc(x.e)}</div>`;
        });
        detail += `<div class="an-block an-rhet"><div class="an-title">修辭分析</div>${r}</div>`;
      }

      if(s.tech) detail += `<div class="an-block an-tech"><div class="an-title">寫作手法</div>${esc(s.tech)}</div>`;
      if(s.symbol) detail += `<div class="an-block an-sym"><div class="an-title">象徵意義</div>${esc(s.symbol)}</div>`;
      if(s.emotion) detail += `<div class="an-block an-emo"><div class="an-title">背後情感</div>${esc(s.emotion)}</div>`;
      if(s.deep) detail += `<div class="an-block an-deep"><div class="an-title">深層分析</div>${esc(s.deep)}</div>`;
      if(s.point) detail += `<div class="an-block an-point"><div class="an-title">考點提示</div>${esc(s.point)}</div>`;

      html += `
      <div class="sentence ${isRead?'':'unread'}" data-key="${key}" onclick="toggleSentence(this, '${key}')">
        <div class="s-text">${markWords(s.text, s.words)}</div>
        <div class="s-trans"><b style="color:#2E6B62;">語譯：</b>${esc(s.trans)}</div>
        <div class="s-tags">${tags.join('')}</div>
        <div class="s-detail">${detail}</div>
      </div>`;
      gi++;
    });
  });

  $('#readerContent').innerHTML = html;
  updateWordPop();
}

function toggleSentence(el, key){
  el.classList.toggle('open');
  const c = CHAPTERS[state.chapter];
  const readMap = LS.get('read', {});
  if(!readMap[c.id]) readMap[c.id] = [];
  if(el.classList.contains('open')){
    if(!readMap[c.id].includes(key)) readMap[c.id].push(key);
  }
  LS.set('read', readMap);
}

function updateWordPop(){
  const pop = $('#wpop');
  document.querySelectorAll('.w').forEach(w=>{
    w.addEventListener('click', e=>{
      e.stopPropagation();
      const deep = w.dataset.deep ? `<div class="wp-deep"><b>深層：</b>${esc(w.dataset.deep)}</div>` : '';
      const py = w.dataset.py ? ` <span style="color:#9A8B6E;font-size:11px;">${esc(w.dataset.py)}</span>` : '';
      const pos = w.dataset.pos ? ` <span style="background:#3A352E;color:#C9A96E;font-size:10px;padding:1px 6px;border-radius:4px;">${esc(w.dataset.pos)}</span>` : '';
      pop.innerHTML = `<b>${esc(w.dataset.w)}</b>${py}${pos}<div style="margin-top:3px;">${esc(w.dataset.d)}</div>${deep}`;
      pop.style.display='block';
      const r = w.getBoundingClientRect();
      let left = r.left + r.width/2 - 135;
      left = Math.max(10, Math.min(left, window.innerWidth-280));
      let top = r.bottom + 8;
      if(top + 120 > window.innerHeight) top = r.top - 110;
      pop.style.left = left+'px';
      pop.style.top = top+'px';
    });
  });
}
document.addEventListener('click', e=>{ if(!e.target.classList.contains('w')) $('#wpop').style.display='none'; });
window.addEventListener('scroll', ()=>{ $('#wpop').style.display='none'; }, true);

/* =========================================================
   朗讀功能（Web Speech API）
   ========================================================= */
const ttsState = {
  playing:false, paused:false,
  currentIndex:0, currentRound:0,
  sentences:[], times:3, rate:1, voice:null
};

function ttsPickVoice(){
  const voices = speechSynthesis.getVoices();
  const pref = ['zh-TW','zh-HK','zh-CN','zh'];
  for(const lang of pref){
    const v = voices.find(v => v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase()));
    if(v) return v;
  }
  return voices[0] || null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{ ttsState.voice = ttsPickVoice(); };
  ttsState.voice = ttsPickVoice();
}

function ttsCollect(){
  const list = [];
  document.querySelectorAll('#readerContent .sentence').forEach(el=>{
    const t = el.querySelector('.s-text');
    if(t) list.push({el, text:(t.innerText||t.textContent).trim()});
  });
  return list;
}

function ttsPlay(){
  if(!('speechSynthesis' in window)){
    alert('您的瀏覽器不支援語音朗讀，請使用 Chrome / Edge / Safari 最新版。');
    return;
  }
  // 續播
  if(ttsState.paused){
    speechSynthesis.resume();
    ttsState.paused = false;
    document.getElementById('ttsPause').innerHTML = '⏸ 暫停';
    return;
  }
  if(ttsState.playing) return;

  ttsState.times = parseInt(document.getElementById('ttsTimes').value) || 1;
  ttsState.rate  = parseFloat(document.getElementById('ttsRate').value) || 1;
  ttsState.currentIndex = 0;
  ttsState.currentRound = 0;
  ttsState.sentences = ttsCollect();
  if(ttsState.sentences.length === 0) return;

  ttsState.playing = true;
  ttsState.paused = false;
  document.getElementById('ttsPlay').style.display = 'none';
  document.getElementById('ttsPause').style.display = 'inline-flex';
  document.getElementById('ttsStop').style.display = 'inline-flex';
  ttsState.voice = ttsPickVoice();
  ttsSpeakNext();
}

function ttsSpeakNext(){
  if(!ttsState.playing) return;
  if(ttsState.currentIndex >= ttsState.sentences.length){
    ttsState.currentRound++;
    if(ttsState.currentRound >= ttsState.times){ ttsFinish(); return; }
    ttsState.currentIndex = 0;
  }
  const item = ttsState.sentences[ttsState.currentIndex];
  document.querySelectorAll('.sentence.tts-reading').forEach(el=>el.classList.remove('tts-reading'));
  item.el.classList.add('tts-reading');
  item.el.scrollIntoView({behavior:'smooth', block:'center'});

  const prog = document.getElementById('ttsProgress');
  if(prog) prog.textContent = `第 ${ttsState.currentRound+1}/${ttsState.times} 次 · 第 ${ttsState.currentIndex+1}/${ttsState.sentences.length} 句`;

  const u = new SpeechSynthesisUtterance(item.text);
  u.lang = 'zh-TW';
  if(ttsState.voice) u.voice = ttsState.voice;
  u.rate = ttsState.rate;
  u.pitch = 1;
  u.onend = ()=>{
    if(!ttsState.playing) return;
    ttsState.currentIndex++;
    setTimeout(ttsSpeakNext, 120);
  };
  u.onerror = ()=>{
    ttsState.currentIndex++;
    setTimeout(ttsSpeakNext, 120);
  };
  speechSynthesis.speak(u);
}

function ttsPause(){
  if(!ttsState.playing) return;
  const btn = document.getElementById('ttsPause');
  if(ttsState.paused){
    speechSynthesis.resume();
    ttsState.paused = false;
    btn.innerHTML = '⏸ 暫停';
  } else {
    speechSynthesis.pause();
    ttsState.paused = true;
    btn.innerHTML = '▶ 繼續';
  }
}

function ttsStop(){
  ttsState.playing = false;
  ttsState.paused = false;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.sentence.tts-reading').forEach(el=>el.classList.remove('tts-reading'));
  const play = document.getElementById('ttsPlay');
  const pause = document.getElementById('ttsPause');
  const stop = document.getElementById('ttsStop');
  if(play) play.style.display = 'inline-flex';
  if(pause) pause.style.display = 'none';
  if(stop) stop.style.display = 'none';
  const prog = document.getElementById('ttsProgress');
  if(prog) prog.textContent = '';
}

function ttsFinish(){
  const prog = document.getElementById('ttsProgress');
  ttsStop();
  if(prog) prog.textContent = '✓ 朗讀完成';
  setTimeout(()=>{ if(prog) prog.textContent = ''; }, 3000);
}
function renderNotes(){
  const notes = LS.get('notes', {});
  $('#notesBody').innerHTML = CHAPTERS.map(c=>`
    <div class="note-card">
      <h4><span class="ci-num">${c.num}</span>${esc(c.title)} <span>· ${esc(c.author)}</span></h4>
      <textarea placeholder="記下這篇的重點、答題框架、易錯字詞、象徵意義、情感分析……" oninput="saveNote('${c.id}', this)">${esc(notes[c.id]||'')}</textarea>
      <div class="save-hint" id="hint-${c.id}">✓ 已儲存</div>
    </div>`).join('');
}
let noteTimer = null;
function saveNote(id, el){
  const notes = LS.get('notes', {});
  notes[id] = el.value;
  LS.set('notes', notes);
  const h = $('#hint-'+id);
  if(h){ h.classList.add('on'); clearTimeout(noteTimer); noteTimer = setTimeout(()=>h.classList.remove('on'), 1200); }
}

function renderStats(){
  const readMap = LS.get('read', {});
  const totalS = CHAPTERS.reduce((a,c)=>a+countSentences(c),0);
  let readN = 0;
  CHAPTERS.forEach(c=>{ readN += (readMap[c.id]||[]).length; });
  const chapRows = CHAPTERS.map(c=>{
    const t = countSentences(c);
    const r = (readMap[c.id]||[]).length;
    return {name:c.title, t, r};
  });
  let html = `
  <div class="stat-grid">
    <div class="stat-box"><div class="num">${readN}<small> / ${totalS}</small></div><div class="lbl">已精讀句數</div></div>
    <div class="stat-box"><div class="num">${Math.round(readN/totalS*100)}<small>%</small></div><div class="lbl">精讀完成度</div></div>
    <div class="stat-box"><div class="num">${CHAPTERS.length}</div><div class="lbl">篇章總數</div></div>
    <div class="stat-box"><div class="num">${totalS}</div><div class="lbl">總句數</div></div>
  </div>
  <div class="panel">
    <h3>各篇精讀進度</h3>
    ${chapRows.map(r=>{
      const p = r.t ? Math.round(r.r/r.t*100) : 0;
      return `<div class="bar-row">
        <div class="bar-lbl">${esc(r.name)}</div>
        <div class="bar-track"><div class="bar-fill ${p<50?'low':''}" style="width:${p}%"></div></div>
        <div class="bar-val">${r.r}/${r.t}</div>
      </div>`;
    }).join('')}
  </div>`;
  $('#statsBody').innerHTML = html;
}

renderSidebar();
renderReader();
renderFramework();
